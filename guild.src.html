<!-- Guild page /g/#<id>[&join=<code>]: one static file per language, the id comes from the hash. Fragment of me.src.html (build_me.py). -->
<style>
.gl { display: grid; gap: 18px; min-width: 0; }
.gl .sec { display: grid; gap: 12px; min-width: 0; }
.gl-head { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 28px; align-items: center; padding: 26px 30px; }
.gl-in { display: grid; gap: 6px; min-width: 0; }
.gl-fac { font-size: .85rem; font-weight: 600; }
.gl-name { margin: 0; font-family: var(--font-display); font-weight: var(--display-w); font-size: clamp(1.9rem, 5vw, 3rem); line-height: 1.04; overflow-wrap: anywhere; }
.gl-motto { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.gl-stats { display: flex; flex-wrap: wrap; gap: 8px 30px; margin: 10px 0 0; }
.gl-stats div { display: grid; gap: 2px; }
.gl-stats dt { font-size: .78rem; color: var(--muted); }
.gl-stats dd { margin: 0; font-size: 1.35rem; font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.gl-stats dd small { margin-left: 8px; font-size: .8rem; font-weight: 500; color: var(--muted); }
.gl-head .g-menu { top: 10px; bottom: auto; right: 10px; }
.gl-head .g-menu > button { bottom: auto; top: 36px; }
.gl-act { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; }
.gl-act:empty { display: none; }
.gl-act label { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: .9rem; }
.gl-act select, .gl-flt select { min-height: 44px; max-width: 100%; border-radius: 8px; border: 1px solid var(--pline); background: var(--panel-2); color: var(--fg); padding: 0 12px; font: inherit; font-size: 1rem; }
.gl-staff { display: grid; gap: 22px; padding: 20px 22px; }
.gl-staff section { display: grid; gap: 12px; min-width: 0; }
.gl-staff h2 { font-size: 1.3rem; margin: 0; }
.gl-link { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.gl-link input { min-height: 44px; min-width: 0; border-radius: 8px; border: 1px solid var(--pline); background: var(--panel-2); color: var(--fg); padding: 0 12px; font: inherit; font-size: .95rem; }
.gl-rql, .gl-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.gl-rql > li { min-width: 0; }
.gl-mc .me-ring, .gl-rqc .me-ring { --room-x: 12px; --room-y: 12px; }   /* same padding and gap as the player card, so the shared ring margin fits */
.gl-mc { padding-bottom: 18px; }
.gl-rqc .pic { grid-row: 1 / 3; }
.g-ch i { font-style: normal; color: var(--ac); }
.gl-rb { position: relative; z-index: 2; grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.gl-rb .btn { min-height: 40px; padding: 0 14px; font-size: .9rem; }
.gl-when { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); }
.gl-cls { display: grid; gap: 10px; }
.gl-bar { display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden; }
.gl-bar i { display: block; min-width: 3px; }
.gl-cl { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0; padding: 0; list-style: none; }
.gl-cl button { min-height: 36px; padding: 0 10px; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--cc); font: inherit; font-size: .92rem; cursor: pointer; }
.gl-cl button b { margin-left: 4px; font-variant-numeric: lining-nums tabular-nums; }
.gl-cl button:hover { border-color: var(--pline); }
.gl-cl button[aria-pressed="true"] { border-color: var(--cc); background: var(--panel-2); }
.gl-flt { display: flex; flex-wrap: wrap; gap: 10px; }
.gl-menu { position: absolute; z-index: 3; right: 8px; bottom: 6px; }
.gl-menu summary { list-style: none; display: grid; place-items: center; width: 44px; height: 32px; border-radius: 6px; color: var(--muted); font-size: 1.2rem; line-height: 1; cursor: pointer; user-select: none; }
.gl-menu summary::-webkit-details-marker { display: none; }
.gl-menu summary:hover, .gl-menu[open] summary { color: var(--fg); background: var(--panel); }
.gl-menu summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.gl-pop { position: absolute; right: 0; bottom: 36px; display: grid; padding: 4px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel); }
.gl-pop button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 6px; background: none; color: var(--fg); font: inherit; font-size: .9rem; text-align: left; white-space: nowrap; cursor: pointer; }
.gl-pop button:hover { background: var(--panel-2); }
.g-dlg p { margin: 0; color: var(--muted); }
@media (max-width: 640px) {
  .gl-head { grid-template-columns: minmax(0, 1fr); padding: 20px 18px; }
  .gl-cr svg { width: 96px; height: 96px; }
  .gl-link { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .gl-link input { grid-column: 1 / -1; }
}
</style>
<!--body-->
<main class="wrap pg-top gl" id="app">
  <h1 class="sr" id="gl-title">Gabella</h1>
  <section class="frame gl-head" id="gl-head"><div class="skel" style="min-height:140px;grid-column:1/-1"></div></section>
  <div class="gl-act" id="gl-act"></div>
  <section class="frame gl-staff" id="gl-staff" hidden></section>
  <section class="sec" id="gl-members" aria-labelledby="glMembersH">
    <div class="sec-h" id="glMembersHd"></div>
    <div class="gl-cls" id="gl-classes"></div>
    <div class="gl-flt"><select id="glFc"></select><select id="glFr"></select></div>
    <div class="gl-list" id="gl-list"></div>
    <button type="button" class="btn ghost g-more" id="glMore" hidden></button>
  </section>
  <section class="sec" id="gl-logsec" aria-labelledby="glLogH">
    <div class="sec-h" id="glLogHd"></div>
    <ol class="g-chron" id="gl-log"></ol>
    <button type="button" class="btn ghost g-more" id="glLogMore" hidden></button>
  </section>
</main>
<!--/body-->
<script>
/* ---------- Guild page: crest header, roster with filters, staff block (link, requests), role menu, chronicle ---------- */
ready(M => {
  if (!M) return down();
  const hash = new URLSearchParams(location.hash.slice(1));
  const key = [...hash.keys()][0] || '';
  const id = /^[1-9]\d{0,9}$/.test(key) ? Number(key) : 0, join = hash.get('join') || '';
  let g = null, me = null, staffData = null, staffBusy = false, staffAgain = false, stale = false, shown = 50, log = { items: [], more: false };
  const flt = { cls: '', rank: '' };
  const RANKS = ['leader', 'officer', 'member'];
  const staff = r => r === 'leader' || r === 'officer';
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const joinUrl = code => new URL(`${guildUrl(id)}&join=${code}`, location.href).href;

  function state(title, text, btn) {
    $('#app').innerHTML = `<section class="frame state"><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ''}<div class="row">${btn}</div></section>`;
  }
  const notFound = () => state(fill(tl('hidden'), { n: id || '' }), tl('not_found'), `<a class="btn" href="${HOME}roster/#guilds">${esc(tl('tab'))}</a>`);
  function down() {
    state(DOWN[0], DOWN[1], `<button type="button" class="btn ghost" id="retry">${esc(DOWN[2])}</button>`);
    $('#retry').onclick = () => location.reload();
  }
  const err = e => M.toast({ kind: 'note', text: (T.gl || {})['e_' + (e && e.code)] || tl('e_generic') });

  /* ----- who I am here: the best rank of my characters in this guild, read from the fresh member list ----- */
  const ownIds = () => new Set(me ? me.characters.map(c => c.id) : []);
  function ownIn() {
    if (!me || !g) return [];
    const ids = ownIds(), rows = g.members.filter(m => ids.has(m.id));
    if (!stale) me.characters.forEach(c => { if (c.guild_id === id && !rows.some(m => m.id === c.id)) rows.push({ id: c.id, name: c.name, rank: c.guild_rank }); });   // a hidden character is not in the list
    return rows;
  }
  const myRank = () => { const r = ownIn().map(m => m.rank); return RANKS.find(x => r.includes(x)) || null; };

  /* ----- API ----- */
  function loadStaff(force) {
    if (!staff(myRank())) { staffData = null; return drawStaff(); }
    if (staffBusy) { if (force) staffAgain = true; return; }   // a change while the list is on its way: ask once more after it
    staffBusy = true;
    M.api(`/g/${id}/staff`).then(s => { staffBusy = false; staffData = s; drawStaff(); drawActions(); if (staffAgain) { staffAgain = false; loadStaff(); } }, () => { staffBusy = false; });
  }
  /* GET /g/:id is cached for a minute on the server and in the browser: for that minute a reload takes the guild this tab got from its own change */
  const KEPT = 'gabella-guild-' + id;
  const keep = x => { try { sessionStorage.setItem(KEPT, JSON.stringify({ t: Date.now(), g: x })); } catch (e) { /* private mode */ } };
  const kept = () => { try { const k = JSON.parse(sessionStorage.getItem(KEPT) || 'null'); return k && Date.now() - k.t < 60000 && k.g.id === id && k.g.log ? k.g : null; } catch (e) { return null; } };
  function setGuild(x) {
    keep(x);
    g = Object.assign({}, g, x);
    if (x.log) log = { items: x.log.items.slice(), more: !!x.log.more };
    draw();
  }
  /** Every change answers with the fresh guild (GET /g/:id is cached for a minute, so it is never asked again). */
  function act(path, o) {
    return M.api(path, o).then(r => {
      stale = true; M.me(true);   // /me follows: characters and my_requests
      if (r.guild) setGuild(r.guild); else draw();
      loadStaff(true);
      return r;
    }, e => { err(e); throw e; });
  }
  const quiet = p => p.catch(() => {});
  const gone = () => { location.href = `${HOME}roster/#guilds`; };
  const done = r => { if (r.disbanded) gone(); };

  /* ----- confirmation ----- */
  function ask(title, body, ok) {
    return new Promise(res => {
      const d = document.createElement('dialog');
      let fin1 = false;
      d.className = 'g-dlg';
      d.setAttribute('aria-labelledby', 'glQH');
      d.innerHTML = `<div class="g-rf"><h2 id="glQH">${esc(title)}</h2>${body ? `<p>${esc(body)}</p>` : ''}
        <div class="row"><button type="button" class="btn" data-ok>${esc(ok)}</button><button type="button" class="btn ghost" data-x>${esc(tl('cancel'))}</button></div></div>`;
      document.body.append(d);
      const fin = v => { if (fin1) return; fin1 = true; res(v); if (d.close) d.close(); else d.removeAttribute('open'); };
      $('[data-ok]', d).onclick = () => fin(true);
      $('[data-x]', d).onclick = () => fin(false);
      d.addEventListener('close', () => { fin(false); d.remove(); });
      d.addEventListener('click', e => { if (e.target === d) fin(false); });
      if (d.showModal) d.showModal(); else d.setAttribute('open', '');
      $('[data-x]', d).focus();
    });
  }

  /* ----- drawing ----- */
  function drawHead() {
    const f = g.faction, name = guildName(g);
    document.title = `${name} — Gabella`;
    $('#gl-title').textContent = name;
    $('#gl-head').innerHTML = `<div class="gl-cr">${crestSvg(g.crest, 128, { label: name })}</div>
      <div class="gl-in"><span class="gl-fac ${f}-c">${esc(FACN[f] || f)}</span>
        <p class="gl-name" aria-hidden="true">${esc(name)}</p>
        ${g.motto ? `<p class="gl-motto">«${esc(g.motto)}»</p>` : ''}
        <dl class="gl-stats">
          <div><dt title="${esc(tl('power_hint'))}">${esc(tl('power'))}</dt><dd>${num(Math.round(g.power))}</dd></div>
          <div><dt>${esc(tl('banners'))}</dt><dd>${num(g.banners)}${g.streak ? `<small>${esc(tl('streak'))} ${num(g.streak)}</small>` : ''}</dd></div>
          <div><dt>${esc(tl('members'))}</dt><dd>${esc(fill(tl('size_n'), { n: num(g.size) }))}</dd></div>
        </dl>
        ${g.rated ? '' : `<p class="small">${esc(tl('unrated'))}</p>`}
        <p class="small">${esc(fill(tl('created'), { d: dateOf(g.created_at) }))}</p></div>
      ${me ? cardMenu('g:' + id, '') : ''}`;
  }

  function drawActions() {
    const r = myRank(), own = ownIn(), out = [];
    const reqs = me ? (me.my_requests || []).filter(q => q.guild_id === id) : [];
    if (!me) {
      if (join) out.push(`<a class="btn" id="glLogin" href="${HOME}profile/">${esc(tl('login_to_join'))}</a>`);
    } else if (own.length) {
      if (staff(r)) out.push(`<button type="button" class="btn ghost" data-do="reqs">${esc(tl('requests'))}${staffData ? ` (${staffData.requests.length})` : ''}</button>`);
      if (staff(r)) out.push(`<a class="btn ghost" href="${HOME}profile/#guild=${id}">${esc(tl('settings'))}</a>`);
      if (r === 'leader') {
        if (g.size === 1) out.push(`<button type="button" class="btn ghost" data-do="disband">${esc(tl('disband'))}</button>`);
      } else {
        own.forEach(c => out.push(`<button type="button" class="btn ghost" data-do="leave" data-char="${c.id}">${esc(tl('leave'))}${own.length > 1 ? ' · ' + esc(c.name) : ''}</button>`));
      }
    } else if (reqs.length) {
      reqs.forEach(q => out.push(`<span class="small">${esc(tl('applied'))}${reqs.length > 1 ? ' · ' + esc(q.name) : ''}</span><button type="button" class="btn ghost" data-do="withdraw" data-char="${q.char_id}">${esc(tl('withdraw'))}</button>`));
    } else if (join) {
      const ok = me.characters.filter(c => !c.guild_id && race(c.race).f === g.faction);
      if (!ok.length) out.push(`<p class="small">${esc(tl('no_char'))}</p>`);
      else {
        if (ok.length > 1) out.push(`<label>${esc(tl('pick_char'))}<select id="glChar">${ok.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>`);
        else out.push(`<span class="small">${esc(ok[0].name)}</span>`);
        out.push(`<button type="button" class="btn" data-do="apply" data-char="${ok[0].id}">${esc(tl('apply'))}</button>`);
      }
    }
    $('#gl-act').innerHTML = out.join('');
  }

  function drawStaff() {
    const el = $('#gl-staff');
    el.hidden = !staff(myRank()) || !staffData;
    if (el.hidden) return;
    const rq = staffData.requests;
    el.innerHTML = `<section aria-labelledby="glLinkH"><h2 id="glLinkH">${esc(tl('link'))}</h2>
        <div class="gl-link"><input type="text" id="glUrl" readonly value="${esc(joinUrl(staffData.join_code))}" aria-labelledby="glLinkH">
          <button type="button" class="btn ghost" data-do="copy">${esc(tl('copy'))}</button><button type="button" class="btn ghost" data-do="reset">${esc(tl('reset'))}</button></div></section>
      <section aria-labelledby="glReqH"><h2 id="glReqH">${esc(tl('requests'))} (${rq.length})</h2>
        ${rq.length ? `<ul class="gl-rql">${rq.map(q => `<li><article class="pcard gl-rqc" style="--cc:${cls(q.class).color}">
          <span class="pic">${ring(q.frame, face(q, q.portrait))}${lvBadge(q)}</span>
          <div class="nm"><a href="${playerUrl(q.user_id)}">${esc(q.name)}</a><small class="g-gl">${esc(tg('glory_n', { n: q.glory }))}</small></div>
          <span class="sub">${subline(q)}</span><span class="gl-when">${esc(ago(q.at))}</span>
          <div class="gl-rb"><button type="button" class="btn" data-do="accept" data-char="${q.char_id}" aria-label="${esc(tl('accept') + ': ' + q.name)}">${esc(tl('accept'))}</button>
            <button type="button" class="btn ghost" data-do="decline" data-char="${q.char_id}" aria-label="${esc(tl('decline') + ': ' + q.name)}">${esc(tl('decline'))}</button></div>
          </article></li>`).join('')}</ul>` : `<p class="small">${esc(tl('no_requests'))}</p>`}</section>`;
  }

  function drawClasses() {
    const e = Object.entries(g.classes || {}).sort((a, b) => b[1] - a[1]);
    $('#gl-classes').innerHTML = e.length ? `<div class="gl-bar" aria-hidden="true">${e.map(([k, n]) => `<i style="flex:${n};background:${cls(k).color}"></i>`).join('')}</div>
      <ul class="gl-cl">${e.map(([k, n]) => `<li><button type="button" data-cls="${esc(k)}" aria-pressed="${flt.cls === k}" style="--cc:${cls(k).color}">${esc(cls(k).n)}<b>${n}</b></button></li>`).join('')}</ul>` : '';
    const fc = $('#glFc'), have = e.map(x => x[0]);
    if (flt.cls && !have.includes(flt.cls)) flt.cls = '';
    fc.innerHTML = `<option value="">${esc(tl('all_classes'))}</option>` + have.map(k => `<option value="${esc(k)}">${esc(cls(k).n)}</option>`).join('');
    fc.value = flt.cls;
  }

  const menuFor = m => {
    const r = myRank();
    if (!me || !r || r === 'member' || m.rank === 'leader' || m.user === me.user.id) return [];
    if (r === 'officer') return m.rank === 'member' ? ['kick'] : [];
    return m.rank === 'officer' ? ['make_member', 'make_leader', 'kick'] : ['make_officer', 'make_leader', 'kick'];
  };
  function mcard(m) {
    const items = menuFor(m);
    return `<article class="pcard gl-mc" style="--cc:${cls(m.class).color}">
      <span class="pic">${ring(m.frame, face(m, m.portrait))}${lvBadge(m)}</span>
      <div class="nm">${m.rank !== 'member' ? `<span class="ttl">${esc(tl(m.rank))}</span>` : ''}<a${m.name_color ? ` class="${nameCls(m.name_color)}"` : ''} href="${playerUrl(m.user)}">${esc(m.name)}</a><small class="g-gl">${esc(tg('glory_n', { n: m.glory }))}</small></div>
      <span class="sub">${subline(m)}</span>
      ${items.length ? `<details class="gl-menu"><summary aria-label="${esc(tg('menu') + ': ' + m.name)}" title="${esc(tg('menu'))}">⋯</summary><div class="gl-pop">${items.map(k => `<button type="button" data-m="${k}" data-char="${m.id}" data-name="${esc(m.name)}">${esc(tl(k))}</button>`).join('')}</div></details>` : ''}
    </article>`;
  }
  function drawMembers() {
    const list = g.members.filter(m => (!flt.cls || m.class === flt.cls) && (!flt.rank || m.rank === flt.rank))
      .sort((a, b) => RANKS.indexOf(a.rank) - RANKS.indexOf(b.rank));
    $('#glCount').textContent = fill(tl('size_n'), { n: num(list.length) });
    $('#gl-list').innerHTML = list.slice(0, shown).map(mcard).join('');
    const more = $('#glMore');
    more.hidden = list.length <= shown;
    more.textContent = tl('more');
  }

  const evText = it => {
    const t = (T.gl || {})['ev_' + it.kind];
    if (!t) return '';
    const who = it.name ? `<i style="--ac:${cls(it.class).color}">${esc(it.name)}</i>` : esc(tl('former'));
    return fill(esc(t), { c: who, r: esc(it.ref || '') });
  };
  const logLine = it => { const t = evText(it); return t ? `<li class="g-ch"><time class="g-chd" datetime="${new Date(it.at).toISOString()}">${esc(dateOf(it.at))}</time><span>${t}</span></li>` : ''; };
  function drawLog() {
    $('#gl-log').innerHTML = log.items.map(logLine).join('');
    const more = $('#glLogMore');
    more.hidden = !log.more;
    more.textContent = tl('more');
  }

  function draw() {
    drawHead(); drawActions(); drawStaff(); drawClasses(); drawMembers(); drawLog();
  }

  /* ----- events: one listener per block, they read the current state ----- */
  function labels() {
    $('#glMembersHd').innerHTML = `<h2 id="glMembersH">${esc(tl('members'))}</h2><span class="small" id="glCount"></span>`;   // headings are written here, so the static page has no empty ones
    $('#glLogHd').innerHTML = `<h2 id="glLogH">${esc(tl('chronicle'))}</h2>`;
    $('#glFc').setAttribute('aria-label', tl('all_classes'));
    const fr = $('#glFr');
    fr.setAttribute('aria-label', tl('all_ranks'));
    fr.innerHTML = `<option value="">${esc(tl('all_ranks'))}</option>` + RANKS.map(k => `<option value="${k}">${esc(tl(k))}</option>`).join('');
  }
  function filtered() { shown = 50; if (g) { drawClasses(); drawMembers(); } }
  $('#glFc').onchange = e => { flt.cls = e.target.value; filtered(); };
  $('#glFr').onchange = e => { flt.rank = e.target.value; filtered(); };
  $('#gl-classes').addEventListener('click', e => {
    const b = e.target.closest('[data-cls]');
    if (!b) return;
    flt.cls = flt.cls === b.dataset.cls ? '' : b.dataset.cls;
    filtered();
  });
  $('#glMore').onclick = () => { shown += 50; drawMembers(); };
  $('#glLogMore').onclick = e => {
    const last = log.items[log.items.length - 1], b = e.currentTarget;
    if (!last) return;
    b.disabled = true;
    M.api(`/g/${id}/log?before=${last.at}&id=${last.id}`).then(r => {
      const have = new Set(log.items.map(x => x.id));
      log = { items: log.items.concat(r.items.filter(x => !have.has(x.id))), more: !!r.more };
      b.disabled = false; drawLog();
    }, () => { b.disabled = false; });
  };

  $('#gl-head').addEventListener('click', e => {
    if (!e.target.closest('[data-report]')) return;
    reportDialog(M, 'g:' + id, guildName(g), [['guild_name', tl('report_name')], ['guild_motto', tl('report_motto')], ['guild_crest', tl('report_crest')]]);
  });

  $('#gl-act').addEventListener('click', e => {
    const b = e.target.closest('[data-do]');
    if (!b || b.disabled) return;
    const what = b.dataset.do, char = b.dataset.char, name = guildName(g);
    if (what === 'reqs') { $('#gl-staff').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); return; }
    const run = (path, o, after) => { b.disabled = true; return act(path, o).then(after || (() => {}), () => { b.disabled = false; }); };
    if (what === 'apply') {
      const sel = $('#glChar');
      run(`/g/${id}/requests`, { body: { code: join, char_id: Number(sel ? sel.value : char) } }, () => M.toast({ kind: 'note', text: tl('applied') }));
    } else if (what === 'withdraw') run(`/g/${id}/requests/${char}`, { method: 'DELETE' });
    else if (what === 'leave') ask(fill(tl('leave_q'), { g: name }), '', tl('leave')).then(ok => ok && run(`/g/${id}/members/${char}`, { method: 'DELETE' }, done));
    else if (what === 'disband') ask(tl('disband'), fill(tl('disband_q'), { g: name }), tl('disband')).then(ok => ok && run(`/g/${id}`, { method: 'DELETE' }, gone));
  });
  $('#gl-act').addEventListener('click', e => { if (e.target.closest('#glLogin')) try { localStorage.setItem('gabella-back', JSON.stringify({ u: location.href, t: Date.now() })); } catch (x) { /* private mode */ } });

  $('#gl-staff').addEventListener('click', e => {
    const b = e.target.closest('[data-do]');
    if (!b || b.disabled) return;
    const what = b.dataset.do, char = b.dataset.char, row = () => { b.disabled = true; };
    if (what === 'copy') {
      const url = joinUrl(staffData.join_code), inp = $('#glUrl');
      copyText(url).then(ok => { if (ok) M.toast({ kind: 'note', text: tl('copied') }); else { inp.focus(); inp.select(); } });
    } else if (what === 'reset') {
      ask(tl('reset'), tl('reset_q'), tl('reset')).then(ok => {
        if (!ok) return;
        M.api(`/g/${id}/link/reset`, { body: {} }).then(r => { staffData.join_code = r.join_code; drawStaff(); }, err);
      });
    } else if (what === 'accept') { row(); act(`/g/${id}/requests/${char}`, { body: {} }).catch(() => { b.disabled = false; }); }
    else if (what === 'decline') { row(); act(`/g/${id}/requests/${char}`, { method: 'DELETE' }).catch(() => { b.disabled = false; }); }
  });

  $('#gl-list').addEventListener('click', e => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const what = b.dataset.m, char = b.dataset.char, name = b.dataset.name, path = `/g/${id}/members/${char}`;
    b.closest('details').removeAttribute('open');
    const rank = r => quiet(act(path, { body: { rank: r } }));
    if (what === 'make_officer') rank('officer');
    else if (what === 'make_member') rank('member');
    else if (what === 'make_leader') ask(fill(tl('leader_q'), { c: name }), '', tl('make_leader')).then(ok => ok && rank('leader'));
    else if (what === 'kick') ask(`${tl('kick')}: ${name}`, '', tl('kick')).then(ok => ok && quiet(act(path, { method: 'DELETE' })));
  });
  document.addEventListener('click', e => $$('.gl-menu[open]').forEach(d => { if (!d.contains(e.target)) d.removeAttribute('open'); }));

  /* ----- start ----- */
  M.onMe(m => { me = m; stale = false; if (g) { draw(); if (staffData === null) loadStaff(); } });
  addEventListener('hashchange', () => location.reload());
  if (!id) return notFound();
  labels();
  const first = x => {
    g = x; log = { items: x.log.items.slice(), more: !!x.log.more };
    draw(); loadStaff();
  };
  const fresh = kept();
  if (fresh) first(fresh);
  else M.api('/g/' + id).then(first, e => (e.status === 404 ? notFound() : down()));
});
</script>

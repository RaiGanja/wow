<!-- «Мой профиль»: login, the first-run wizard, the cabinet. Fragment of me.src.html, built by build_me.py into profile/. -->
<style>
.pf { display: grid; gap: 18px; }
.pf .lab { margin: 0 0 8px; line-height: 1.4; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gold-2); }
.login { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: center; padding: 28px 30px; }
.login h2 { font-size: clamp(1.35rem, 7vw, 1.7rem); margin-bottom: 6px; }
.login p { margin: 0; color: var(--muted); max-width: 62ch; }
.login ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
.login ul li::marker { color: var(--gold); }
.wayc { display: grid; gap: 14px; width: 300px; max-width: 100%; }
.ways { display: grid; gap: 8px; }
.way { justify-content: flex-start; gap: 12px; }
.way svg, .idl svg { width: 20px; height: 20px; fill: var(--gold-2); flex: none; }
.mailf { display: grid; gap: 10px; }
.mailf input { min-height: 46px; width: 100%; border-radius: 8px; border: 1px solid var(--pline); background: var(--panel-2); color: var(--fg); padding: 0 12px; font: inherit; font-size: 1rem; }
.mailf input:focus { outline: none; border-color: var(--gold); }
.mailf .small, .mailf .msg { margin: 0; }
.notice { padding: 16px 20px; }
.notice h2 { font-size: 1.3rem; margin-bottom: 4px; }
.notice p { margin: 0; color: var(--muted); }
.idl { display: grid; }
.idl .it { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--pline); }
.idl .it:last-child { border-bottom: 0; }
.idl .it b { font-weight: 600; }
.idl .sp { flex: 1; }
.idl .btn { min-height: 40px; padding: 0 14px; font-size: .9rem; }
.next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.nx { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; align-content: start; padding: 14px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); }
.nx .ic { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 8px; padding: 3px; background: linear-gradient(145deg, #f0d58c, #7a5a1c 55%, #c9a54a); }

.nx p { margin: 0; font-size: .85rem; color: var(--muted); }

.path b { color: var(--fg); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
/* cabinet blocks under the card (next steps, path strip, menu) keep air between them; a section title sits off its panels */
#view > :is(.bcard, .ask, .path, section:not(.wiz)) + :is(.ask, .path, .lay, section:not(.wiz)) { margin-top: 18px; }
#view > section:not(.wiz) > .sec-h { margin: 8px 0 12px; }
.ask { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 18px; }
.ask span { flex: 1 1 260px; }
.lay { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.pnav { position: sticky; top: calc(var(--top) + 16px); display: grid; gap: 2px; padding: 8px; }
.pnav a { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
:root[data-theme="light"] .pnav a { color: var(--muted); }
.pnav a:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); }
.pnav a[aria-current] { background: var(--panel-2); color: var(--fg); box-shadow: inset 2px 0 0 var(--gold); }
.pnav a span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pnav hr { border: 0; border-top: 1px solid var(--pline); margin: 6px 8px; }

.sec { display: grid; gap: 14px; min-width: 0; }
.sec > p { margin: 0; color: var(--muted); max-width: 70ch; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.plist .pcard { cursor: pointer; text-align: left; font: inherit; color: inherit; }
.plist .pcard:hover { border-color: var(--gold); }
.plist .pcard.main { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
.add { display: grid; place-items: center; align-content: center; gap: 6px; min-height: 130px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--muted); background: none; font: inherit; cursor: pointer; }
.add:hover { border-color: var(--gold); color: var(--fg); }
.add b { color: var(--fg); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.box { display: grid; gap: 12px; padding: 18px 20px; }
.box h3 { font-family: var(--font-body); font-size: 1.05rem; font-weight: 600; letter-spacing: 0; }
.box .small { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.form label, .form .fl { display: grid; gap: 6px; font-size: .9rem; color: var(--muted); font-weight: 500; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.form input:not([type="checkbox"]), .form select, .box input:not([type="checkbox"]), .box select { min-height: 46px; width: 100%; border-radius: 8px; border: 1px solid var(--pline); background: var(--panel-2); color: var(--fg); padding: 0 12px; font: inherit; font-size: 1rem; }
.form input:focus, .form select:focus, .box input:focus, .box select:focus { outline: none; border-color: var(--gold); }
.form .seg { justify-self: start; }
.form .pair { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
.chk { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--fg); font-weight: 500; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.cats button { display: grid; gap: 6px; padding: 12px 14px; text-align: left; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); color: var(--fg); font: inherit; cursor: pointer; }
.cats button[aria-pressed="true"] { border-color: var(--gold); }
.cats b { font-weight: 600; font-size: .95rem; }
.cats span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cats .bar { height: 4px; }
/* wizard */
.wiz { display: grid; gap: 16px; padding: 22px 24px; }
.wiz .wsteps { display: flex; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.wiz .wsteps span[aria-current] { color: var(--gold-2); font-weight: 600; }
.wiz h2 { font-size: 1.7rem; }
.facs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.facs button { position: relative; min-height: 200px; overflow: hidden; isolation: isolate; display: grid; align-content: end; padding: 18px; border: 1px solid var(--pline); border-radius: 10px; background: #0b0d12; color: #f1ece0; text-align: left; font: inherit; cursor: pointer; }
.facs img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; z-index: -2; filter: brightness(.6); transition: filter .3s; }
.facs button::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(transparent 40%, rgba(0,0,0,.75)); }
.facs button:hover img { filter: brightness(.8); }
.facs b { font-family: var(--font-display); font-size: 2rem; color: var(--fc); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.picks button { display: grid; justify-items: center; gap: 8px; padding: 14px 8px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); color: var(--fg); font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; }
.picks button:hover { border-color: var(--gold); }
.picks button[aria-pressed="true"], .picks button[aria-checked="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.picks .me-ring { --s: 64px; margin: 0; }
.picks small { color: var(--muted); font-weight: 500; }
.signed { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 14px; color: var(--muted); font-size: .92rem; }
.signed .btn { min-height: 38px; padding: 0 14px; font-size: .9rem; }
.signed + .sec { margin-top: 12px; }
.founder { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; padding: 14px 18px; }
.founder b { font-family: var(--font-display); font-size: 1.2rem; color: var(--gold-2); }
.founder p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.founder .fcd { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; text-align: right; font-variant-numeric: lining-nums; }
.founder .fcd small { display: block; font-family: var(--font-body); font-size: .78rem; color: var(--muted); }
/* side panel: the character editor */
.side { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(520px, 100vw); padding: 0; border: 0; border-left: 1px solid var(--pline); background: var(--surface); color: var(--fg); }
.side::backdrop { background: rgba(0,0,0,.55); }
.side .dh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 20px; min-height: var(--top); background: var(--surface); border-bottom: 1px solid var(--line); }
.side .dh b { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; }
.side .form { padding: 20px; }
.side .act { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.side .act .sp { flex: 1; }
.cdlg { width: min(460px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--pline); border-radius: 12px; background: var(--surface); color: var(--fg); }
.cdlg::backdrop { background: rgba(0,0,0,.6); }
.cdlg .in { display: grid; gap: 12px; padding: 22px; }
.cdlg h2 { font-size: 1.5rem; }
.cdlg p { margin: 0; color: var(--muted); }
.cdlg input { min-height: 46px; border-radius: 8px; border: 1px solid var(--pline); background: var(--panel-2); color: var(--fg); padding: 0 12px; font: inherit; }
/* reports (admin) */
.g-rep { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); }
.g-rep h3 { font-family: var(--font-body); font-size: 1rem; font-weight: 600; letter-spacing: 0; overflow-wrap: anywhere; }
.g-rep p { margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.g-rep .row .btn { min-height: 40px; padding: 0 14px; font-size: .9rem; }
@media (max-width: 1100px) { .next { grid-template-columns: 1fr; } }
@media (max-width: 960px) {
  .lay { grid-template-columns: 1fr; }
  .pnav { position: static; display: flex; overflow-x: auto; }
  .pnav hr { display: none; }
  .pnav a { white-space: nowrap; }
  .plist { grid-template-columns: 1fr; }
  .login, .founder { grid-template-columns: minmax(0, 1fr); }
  .founder .fcd { text-align: left; }
}
@media (max-width: 600px) {
  .form, .facs { grid-template-columns: 1fr; }
  .login { padding: 20px 16px; }
  .side { width: 100vw; }
}
@media (prefers-reduced-motion: reduce) { .facs img { transition: none; } }
.lkbox .me-ring { --room-x: 6px; --room-y: 6px; }
.pitem { display: grid; gap: 6px; align-content: start; }
.pitem > .btn { justify-self: start; }
.lk { display: grid; gap: 14px; padding: 20px; }
.lk-prev { display: flex; align-items: center; gap: 14px; position: sticky; top: var(--top); z-index: 1; padding: 10px 0; background: var(--surface); }
.lk-prev .me-ring { --s: 120px; --room-x: 14px; --room-y: 16px; }
.lk .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); }
.lk .tabs button { padding: 8px 14px; border: 0; background: none; color: var(--muted); font: inherit; border-bottom: 2px solid transparent; cursor: pointer; }
.lk .tabs [aria-selected="true"] { color: var(--fg); border-bottom-color: var(--gold); }
.lk-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(96px, 100%), 1fr)); gap: 8px; }
.lk-tiles button { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); color: var(--fg); font: inherit; font-size: .85rem; cursor: pointer; }
.lk-tiles button[aria-checked="true"] { border-color: var(--gold); }
.lk-tiles .me-ring { --s: 64px; --room-x: 10px; --room-y: 10px; }
.lk-tiles button:focus-visible, .lk .tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>

<main class="wrap pg-top pf" id="app">
  <h1 class="sr">Мой профиль</h1>
  <div id="view"><div class="skel" style="min-height:250px"></div></div>
</main>

<dialog class="side" id="edDlg" aria-labelledby="edT">
  <div class="dh"><b id="edT">Персонаж</b><button class="iconbtn" id="edClose" type="button" aria-label="Закрыть"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <form class="form" id="edForm" novalidate>
    <label class="full">Имя<input id="eName" maxlength="12" autocomplete="off" spellcheck="false" required></label>
    <div class="fl full"><span id="leF">Фракция</span><div class="seg" id="eF" aria-labelledby="leF"><button type="button" data-v="alliance">Альянс</button><button type="button" data-v="horde">Орда</button></div></div>
    <label>Раса<select id="eRace"></select></label>
    <label>Класс<select id="eCls"></select></label>
    <div class="fl"><span id="leRole">Роль</span><div class="seg" id="eRole" aria-labelledby="leRole"></div></div>
    <label>Уровень<input id="eLvl" type="number" min="1" max="60" inputmode="numeric" value="1"></label>
    <div class="fl full"><span id="leT">Когда играете</span><div class="seg" id="eT" aria-labelledby="leT"><button type="button" data-v="morning">Утро</button><button type="button" data-v="evening">Вечер</button><button type="button" data-v="night">Ночь</button></div></div>
    <div class="fl"><span>Профессия 1</span><div class="pair"><select id="eP1" aria-label="Профессия 1"></select><input id="eS1" type="number" min="1" max="300" inputmode="numeric" placeholder="1–300" aria-label="Навык профессии 1"></div></div>
    <div class="fl"><span>Профессия 2</span><div class="pair"><select id="eP2" aria-label="Профессия 2"></select><input id="eS2" type="number" min="1" max="300" inputmode="numeric" placeholder="1–300" aria-label="Навык профессии 2"></div></div>
    <p class="msg full" id="eNote" role="alert"></p>
    <div class="act"><button type="submit" class="btn" id="eSave">Сохранить</button><button type="button" class="btn ghost" id="eMain">Сделать основным</button><span class="sp"></span><button type="button" class="btn danger" id="eDel">Удалить персонажа</button></div>
  </form>
</dialog>

<dialog class="side" id="lookDlg" aria-labelledby="lookT">
  <div class="dh"><b id="lookT">Облик</b><button type="button" class="btn ghost" data-look-close aria-label="Закрыть">✕</button></div>
  <div class="lk">
    <div class="lk-prev" id="lkPrev"></div>
    <div class="tabs" role="tablist" aria-label="Облик">
      <button type="button" role="tab" id="lkTabSex" aria-controls="lkPane" aria-selected="true" data-tab="sex">Пол</button>
      <button type="button" role="tab" id="lkTabBg" aria-controls="lkPane" aria-selected="false" data-tab="bg">Фон</button>
    </div>
    <div id="lkPane" role="tabpanel" class="lk-tiles"></div>
    <div class="act"><button type="button" class="btn ghost" data-look-rand>Случайно</button><button type="button" class="btn ghost" data-look-reset>Сбросить</button><span class="sp"></span><button type="button" class="btn" data-look-save>Сохранить</button></div>
    <p class="msg" id="lookMsg" role="status"></p>
  </div>
</dialog>

<dialog class="cdlg" id="delDlg" aria-labelledby="delT">
  <form class="in" method="dialog" id="delForm">
    <h2 id="delT">Удалить профиль</h2>
    <p>Персонажи, достижения, очки и место в списке игроков исчезнут навсегда. Вернуть их нельзя.</p>
    <label class="small" for="delWord">Чтобы подтвердить, введите слово <b id="delW">УДАЛИТЬ</b></label>
    <input id="delWord" autocomplete="off" spellcheck="false">
    <p class="msg err" id="delNote" role="alert"></p>
    <div class="row"><button type="button" class="btn danger" id="delGo" disabled>Удалить навсегда</button><button type="button" class="btn ghost" id="delNo">Отмена</button></div>
  </form>
</dialog>

<script>
/* ---------- Profile: login, first-run wizard, cabinet sections in the hash, the character editor ---------- */
const ERR = {
  bad_name: 'Имя: от 2 до 12 букв одного алфавита, без цифр и пробелов.', bad_race: 'Выберите расу.', bad_combo: 'Такого сочетания расы и класса нет.',
  bad_role: 'Эта роль классу недоступна.', bad_level: 'Уровень — от 1 до 60.', bad_prof: 'Две разные профессии из списка.',
  bad_skill: 'Навык — от 1 до 300 и только у выбранной профессии.', bad_playtime: 'Выберите, когда играете.', limit: 'Не больше десяти персонажей.',
  locked: 'Это ещё не открыто.', auth: 'Сессия закончилась, войдите снова.',
  bot: 'Проверка «не робот» не прошла. Попробуйте ещё раз.', bad_email: 'Проверьте адрес почты.', mail_down: 'Письмо не ушло. Попробуйте через пару минут.',
  last_identity: 'Это последний способ входа, его нельзя отвязать.',
};
/** Text of an API error code: the MORE texts (err_<code>: bad_word, no_links, members_only) first, then ERR. */
const errText = (e, def) => {
  const c = e && e.code;
  return (c && T.g && T.g['err_' + c]) || ERR[c] || def || 'Не получилось сохранить. Попробуйте ещё раз.';
};
const SECS0 = [['chars', 'Персонажи'], ['look', 'Внешний вид'], ['ach', 'Достижения'], ['frames', 'Рамки и ранги'], ['account', 'Аккаунт']];
const secs = () => (m && m.admin ? SECS0.concat([['reports', tg('tab_reports')]]) : SECS0);   // «Reports» is for the admin only
const DEL_WORD = 'УДАЛИТЬ';
const CHAR_MAX = 10;   // same as LIMIT in the API (a Classic Era realm)
const FIRST = ['profile_full', 'radio_on', 'guides3', 'party5', 'play_page'];
const ACT = {
  guide: ['Открыть гайды', 'guides/'], class: ['Открыть классы', 'classes/'], race: ['Открыть расы', 'races/'], play_page: ['Открыть «В игре»', 'play/'],
  party5: ['Собрать группу', 'tools/#raid'], raid40: ['Собрать рейд', 'tools/#raid'], share_team: ['Собрать группу', 'tools/#raid'],
  compare3: ['Сравнить', 'tools/#compare'], search: ['Искать', 'tools/#search'], lang: ['Сменить язык', null],
  radio_on: ['Включить радио', 'radio'], radio_min: ['Включить радио', 'radio'], station: ['Включить радио', 'radio'], sleep_timer: ['Включить радио', 'radio'],
  show_card: ['Скопировать ссылку', 'card'], three_chars: ['Добавить персонажа', 'add'], profile_full: ['Заполнить персонажа', 'edit'],
  recruiter1: ['Ссылка для друга', 'account'], recruiter5: ['Ссылка для друга', 'account'],
};
let M = null, m = null, sec = 'chars', cat = '', wiz = null, edit = null, lastRank = null, reveal = false;
let reps = null, repsLoading = false;

const mainOf = () => m.characters.find(c => c.is_main) || m.characters[0];
const have = () => new Map(m.achievements.map(a => [a.id, a]));
const ctx = () => ({ progress: m.progress, user: m.user, chars: m.characters, have: new Set(m.achievements.map(a => a.id)) });
const asPlayer = c => ({ id: m.user.id, nick: m.user.show_nick ? m.user.nick : null, frame: m.user.frame, rank: m.user.rank,
  points: m.user.points, joined: m.user.joined_guild_at, member: m.user.member, main: c });
const myUrl = () => new URL(playerUrl(m.user.id), location.href).href;
const refUrl = () => new URL(`${HOME}profile/?ref=${m.user.id}`, location.href).href;

const WAYS = [['discord', 'Discord'], ['google', 'Google'], ['bnet', 'Battle.net'], ['telegram', 'Telegram'], ['email', 'Почта']];
const wayIco = id => `<svg viewBox="0 0 24 24" aria-hidden="true"><path${id === 'email' ? ' fill-rule="evenodd"' : ''} d="${WAY_ICON[id === 'email' ? 'mail' : id]}"/></svg>`;
const REF = /^(\d{1,20}|u_[0-9a-f]{16})$/;
const TS_KEY = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? '1x00000000000000000000AA' : '0x4AAAAAAFil-dgnPKkeExYt';   // Turnstile site key is public
const apiBase = () => (M ? M.API : 'https://api.gabella.site');
function savedRef() { try { const r = localStorage.getItem('gabella-ref') || ''; return REF.test(r) ? r : ''; } catch (e) { return ''; } }
function authUrl(p, link) {
  const ref = savedRef();
  return `${apiBase()}${p === 'discord' ? '/auth/login' : `/auth/${p}/login`}?lang=${LANG}` + (ref ? `&ref=${ref}` : '') + (link ? '&link=1' : '');
}
/** Discord, Google and Battle.net are plain links; Telegram and email open here. link: attach to the signed-in account. */
function wayBtn(id, label, link) {
  if (id === 'telegram' || id === 'email') return `<button type="button" class="btn ghost way" data-way="${id}"${link ? ' data-link="1"' : ''}>${wayIco(id)}${esc(label)}</button>`;
  return `<a class="btn ghost way" href="${esc(authUrl(id, link))}">${wayIco(id)}${esc(label)}</a>`;
}

/* ---------- Turnstile («not a robot»): the script loads only when a check is needed ---------- */
let tsLoad = null;
function tsWidget(host) {
  tsLoad = tsLoad || new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    sc.async = true; sc.onload = ok; sc.onerror = () => { tsLoad = null; no(); };
    document.head.append(sc);
  });
  let done, token = new Promise(r => { done = r; });
  const w = tsLoad.then(() => window.turnstile.render(host, {
    sitekey: TS_KEY, language: LANG === 'pt' ? 'pt-br' : LANG,
    theme: document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark',
    callback: t => done(t), 'expired-callback': () => { token = new Promise(r => { done = r; }); },
  }));
  return {
    host,
    /** The token, or '' if the check did not pass within 15 s (the widget then asks its own question). */
    get: () => Promise.race([w.then(() => token), new Promise(r => setTimeout(() => r(''), 15000))]).catch(() => ''),
    reset: () => { token = new Promise(r => { done = r; }); w.then(id => window.turnstile.reset(id), () => {}); },
  };
}
let tsMail = null, tsChar = null;

/* ---------- email: the letter links to this page with #email=<token> (mail scanners open links but run no JS) ---------- */
function openMail(link) {
  const f = $('#mailF');
  if (!f) return;
  f.hidden = false; f.dataset.link = link ? '1' : '';
  mailNote('');
  if (!tsMail || tsMail.host !== $('#tsBox')) tsMail = tsWidget($('#tsBox'));
  $('#mAddr').focus();
}
function mailNote(text, bad) { const n = $('#mNote'); if (n) { n.textContent = text; n.className = 'msg' + (bad ? ' err' : ''); } }
document.addEventListener('submit', e => {
  if (e.target.id !== 'mailF') return;
  e.preventDefault();
  const addr = $('#mAddr').value.trim(), link = !!e.target.dataset.link;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@.]{2,}$/.test(addr)) return mailNote(ERR.bad_email, true);
  $('#mGo').disabled = true; mailNote('');
  tsMail.get().then(t => {
    if (!t) { $('#mGo').disabled = false; return mailNote(ERR.bot, true); }
    return M.api('/auth/email', { body: { email: addr, lang: LANG, ref: savedRef(), link, turnstile: t } }).then(() => {
      if (!link) return screen('mail', addr);
      $('#mGo').disabled = false; tsMail.reset();
      mailNote(fill('Ссылка ушла на %e. Откройте её, чтобы привязать почту.', { e: addr }));
    }, e2 => { $('#mGo').disabled = false; tsMail.reset(); mailNote(errText(e2, 'Письмо не ушло. Попробуйте ещё раз.'), true); });
  });
});
// A link opened where the letter was not asked for (another browser, or someone else's link) does not sign in silently:
// the API answers {confirm, hint} and the person decides, seeing whose address it is.
function mailVerify(t, confirm) {
  M.api('/auth/email/verify', { body: confirm ? { t, confirm: true } : { t } }).then(r => (r.confirm
    ? screen('confirm', { why: 'Ссылку открыли не в том браузере, где просили письмо.', who: r.hint, go: () => mailVerify(t, true) })
    : arrive(r.go)), e => {
    notice = e.code === 'link_expired' ? 'link-expired' : e.code === 'link_used' ? 'link-used' : e.code === 'link_other_browser' ? 'link-other' : 'login-down';
    follow();
  });
}

/* ---------- Telegram: its own login window on oauth.telegram.org, no widget script on the page ---------- */
let tgBot = null;
function tgConfig() { if (!tgBot && M) M.api('/auth/telegram/config').then(c => { tgBot = c.bot_id; }, () => {}); }
function tgOpen(link) {
  if (!tgBot) {   // the bot id comes with the page's first screen; without it the Telegram window cannot open
    tgConfig();
    const n = link && $('#idNote');
    if (n) { n.textContent = STATES['login-down'][1]; n.className = 'msg err'; return; }
    notice = 'login-down'; return render();
  }
  try { sessionStorage.setItem('gabella-tg-link', link ? '1' : ''); localStorage.setItem('gabella-tg', String(Date.now())); } catch (e) { /* private mode */ }
  const url = `https://oauth.telegram.org/auth?bot_id=${tgBot}&origin=${encodeURIComponent(location.origin)}&lang=${LANG}&return_to=${encodeURIComponent(location.href.split('#')[0])}`;
  const w = 550, h = 470;   // centred on this window (`screen` here is the page's own function)
  const pop = open(url, 'telegram_oauth_bot' + tgBot, `width=${w},height=${h},left=${Math.max(0, screenX + (outerWidth - w) / 2)},top=${Math.max(0, screenY + (outerHeight - h) / 2)}`);
  if (!pop) { location.href = url; return; }   // no popup (phones): Telegram comes back with #tgAuthResult=
  const onMsg = e => {
    if (e.source !== pop) return;
    let d = {};
    try { d = JSON.parse(e.data); } catch (x) { /* not ours */ }
    if (d.event !== 'auth_result') return;
    removeEventListener('message', onMsg);
    try { pop.close(); } catch (x) { /* closed already */ }
    if (d.result) tgSend(d.result);
  };
  addEventListener('message', onMsg);
}
function tgSend(user) {
  let link = false;
  try { link = sessionStorage.getItem('gabella-tg-link') === '1'; sessionStorage.removeItem('gabella-tg-link'); } catch (e) { /* private mode */ }
  M.api('/auth/telegram', { body: Object.assign({}, user, { lang: LANG, ref: savedRef(), link }) }).then(r => arrive(r.go), e => {
    notice = e.status === 401 ? 'auth' : 'login-down';
    follow();
  });
}
/** Telegram's answer in the hash counts only if the sign-in was started here in the last 10 minutes (the mark tgOpen leaves);
    otherwise it may be someone else's link, and the person is asked first. */
function tgFromHash(b64) {
  let user = null, mine = false;
  try { user = JSON.parse(decodeURIComponent(escape(atob(b64.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { /* broken */ }
  try { mine = Date.now() - Number(localStorage.getItem('gabella-tg') || 0) < 600000; localStorage.removeItem('gabella-tg'); } catch (e) { /* private mode */ }
  if (user && mine) return tgSend(user);
  if (user) return screen('confirm', { why: 'Вход через Telegram начат не на этой странице.', who: user.username ? '@' + user.username : user.first_name, go: () => tgSend(user) });
  notice = 'login-down';
  follow();
}
document.addEventListener('click', e => {
  const w = e.target.closest('[data-way]');
  if (!w || !e.target.closest('#view')) return;
  if (w.dataset.way === 'telegram') tgOpen(!!w.dataset.link);
  else openMail(!!w.dataset.link);
});

/** After Telegram or email the API answers {go: profile URL[#state]} and has set the session cookie. */
function arrive(go) {
  const u = new URL(go, location.href), st = u.hash.slice(1);
  if (u.pathname !== location.pathname) { location.href = u.href; return; }
  if (st) notice = st;
  else try { localStorage.setItem('gabella-me', '1'); } catch (e) { /* private mode */ }
  follow(true);
}

/* ---------- screens before the cabinet ---------- */
function screen(kind, arg) {
  parkForm();
  const v = $('#view');
  if (kind === 'login') {
    tgConfig();
    v.innerHTML = `${noticeHtml()}<section class="frame login"><div><h2>Войдите в профиль</h2>
      <p>Пароля нет: войдите любым удобным способом. Что мы получаем от каждого — в разделе <a href="${HOME}privacy/#account">«Конфиденциальность»</a>.</p>
      <ul><li>До десяти персонажей, основной виден в списке игроков.</li><li>Достижения, ранги и рамки портрета.</li><li>Рамка «Основатель» — для тех, кто успеет до старта 4 ноября.</li></ul></div>
      <div class="wayc"><div class="ways">${WAYS.map(([id, n]) => wayBtn(id, n, false)).join('')}</div>${mailForm()}</div></section>`;
  } else if (kind === 'confirm') {
    v.innerHTML = `<section class="frame state"><h2>Войти по ссылке?</h2><p>${esc(arg.why)} ${esc(arg.who ? fill('Войти как %e?', { e: arg.who }) : 'Войти?')}</p>
      <p>Если вход просили не вы, не входите: ссылка может вести в чужой аккаунт.</p>
      <div class="row"><button type="button" class="btn" id="cGo">Войти</button><button type="button" class="btn ghost" id="cNo">Не входить</button></div></section>`;
    $('#cGo').onclick = () => { $('#cGo').disabled = true; arg.go(); };
    $('#cNo').onclick = () => follow();
  } else if (kind === 'mail') {
    v.innerHTML = `<section class="frame state"><h2>Проверьте почту</h2><p>${esc(fill('Ссылка для входа ушла на %e. Она действует 15 минут. Нет письма — загляните в «Спам».', { e: arg }))}</p>
      <div class="row"><button type="button" class="btn ghost" id="mAgain">Другой адрес</button></div></section>`;
    $('#mAgain').onclick = () => { screen('login'); openMail(false); };
  } else {
    v.innerHTML = `<section class="frame state"><h2>Сервер профилей не отвечает</h2><p>Попробуйте через пару минут. Остальной гид работает как обычно.</p>
      <div class="row"><button type="button" class="btn ghost" id="retry">Повторить</button></div></section>`;
    $('#retry').onclick = start;
  }
}

  return `<div class="frame founder"><div><b>Рамка «Основатель»</b><p>Добавьте персонажа до старта 4 ноября — золотая рамка останется навсегда.</p></div>

}

document.addEventListener('click', e => {

/* ---------- the character form: in the wizard and in the side panel ---------- */

function skillState() { ['1', '2'].forEach(i => { const on = !!$('#eP' + i).value; $('#eS' + i).disabled = !on; if (!on) $('#eS' + i).value = ''; }); }
function fillForm(c, wizardMode) {

  segSet('eF', f); fillRaces(f, c ? c.race : w && w.race); fillClasses(c ? c.class : w && w.cls); fillRoles(c ? c.role : 'dps'); fillProfs();

function formBody() {
  const n = v => (v === '' ? null : +v);

    name: $('#eName').value.trim(), race: $('#eRace').value, class: $('#eCls').value, role: segVal('eRole'), level: +$('#eLvl').value,

  };
}
function check(b) {
  // one alphabet, as the API: a latin name with one cyrillic letter passes for someone else's name
  if (!/^\p{L}{2,12}$/u.test(b.name) || [/\p{Script=Latin}/u, /\p{Script=Cyrillic}/u, /\p{Script=Greek}/u].filter(r => r.test(b.name)).length > 1) return 'bad_name';
  if (!Number.isInteger(b.level) || b.level < 1 || b.level > 60) return 'bad_level';
  if (b.prof1 && b.prof1 === b.prof2) return 'bad_prof';
  for (const s of [b.prof1_skill, b.prof2_skill]) if (s !== null && !(Number.isInteger(s) && s >= 1 && s <= 300)) return 'bad_skill';
  return null;
}
function note(text, bad) { $('#eNote').textContent = text; $('#eNote').className = 'msg full' + (bad ? ' err' : ''); }
function busy(on) { $$('#edForm button').forEach(b => { b.disabled = on; }); }

function wireForm() {
  $('#eF').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; segSet('eF', b.dataset.v); fillRaces(b.dataset.v); fillClasses(); fillRoles(segVal('eRole')); });

  $('#eCls').onchange = () => fillRoles(segVal('eRole'));

  $('#eName').addEventListener('input', () => { if (wiz) wiz.name = $('#eName').value.trim(); });
  $('#edForm').addEventListener('submit', e => {

    const nick = $('#eNick'), setNick = nick && nick.checked !== !!m.user.show_nick ? nick.checked : null, ts = !edit && tsChar;
    (ts ? ts.get() : Promise.resolve(null)).then(t => {

      if (t) b.turnstile = t;
      if (!edit && wiz && wiz.look) b.look = wiz.look;
      const req = edit ? M.api('/characters/' + edit, { method: 'PUT', body: b }) : M.api('/characters', { body: b });
      return req.then(r => (setNick !== null ? M.api('/me', { method: 'PUT', body: { show_nick: setNick } }).then(r2 => Object.assign(r, { me: r2.me })) : r))
        .then(r => { busy(false); if (!edit) { wiz = null; parkForm(); } closeEd(); M.took(r); },
          e2 => { busy(false); if (ts) ts.reset(); note(errText(e2), true); });
    });
  });
  $('#eMain').onclick = () => { busy(true); M.api(`/characters/${edit}/main`, { body: {} }).then(r => { busy(false); closeEd(); M.took(r); }, e => { busy(false); note(errText(e), true); }); };
  $('#eDel').onclick = () => {
    const c = m.characters.find(x => x.id === edit);

  };
  $('#edClose').onclick = closeEd;

}

/* ---------- cabinet ---------- */
const fresh = () => m.achievements.length < 3;   // a newcomer: the first steps go first
function nextUp() {
  const h = have(), c = ctx(), out = [];
  for (const a of GD.ach) {
    if (h.has(a.id) || a.secret || a.kind === 'admin') continue;
    const key = a.rule && a.rule.key || a.id;
    if (!ACT[key]) continue;   // only what a button can move forward
    const pr = achProgress(a, c);
    out.push({ a, pr, pct: pr ? pr.v / pr.goal : 0, key });
  }
  out.sort((x, y) => y.pct - x.pct);
  if (fresh()) out.sort((x, y) => (FIRST.indexOf(x.a.id) + 1 || 99) - (FIRST.indexOf(y.a.id) + 1 || 99));
  return out.slice(0, 3);
}

function secAch() {
  const h = have(), c = ctx();
  const sum = (list) => [list.filter(a => h.has(a.id)).length, list.length];
  const btn = (id, label, list) => {
    const [n, t] = sum(list), secret = id === 'secrets';
    return `<button type="button" data-cat="${id}" aria-pressed="${cat === id}"><b>${esc(label)}</b><span>${secret ? fill('%v из ?', { v: n }) : fill('%v из %g', { v: n, g: t })}</span><span class="bar"><i style="width:${Math.round(100 * n / t)}%"></i></span></button>`;
  };
  const list = GD.ach.filter(a => !cat || a.cat === cat);
  list.sort((x, y) => (h.has(y.id) ? 1 : 0) - (h.has(x.id) ? 1 : 0));
  return `<div class="sec-h"><h2>Достижения</h2><span class="small">${esc(fill('Очки: %n', { n: m.user.points }))}</span></div>
    <div class="cats" role="group" aria-label="Категории">${btn('', 'Все', GD.ach)}${GD.cats.map(k => btn(k, T.cats[k] || k, GD.ach.filter(a => a.cat === k))).join('')}</div>
    <div class="achs">${list.map(a => achTile(a, h.get(a.id), c)).join('')}</div>`;
}
function secFrames() {
  const u = m.user, c = mainOf(), pics = pic(c), open = new Set(m.frames);
  const ladder = GD.ranks.map(r => {
    const on = open.has(r.id);
    return `<${on ? 'button type="button" data-frame="' + r.id + '"' : 'div'} class="rstep${u.rank === r.id ? ' cur' : ''}${on ? '' : ' lock'}">${ring(r.id, pics, on ? '' : 'locked')}<b>${esc(rankName(r.id))}</b><span>${esc(fill('%n очков', { n: r.pts }))}</span></${on ? 'button' : 'div'}>`;
  }).join('') + `<div class="rstep${open.has('boss') ? '' : ' lock'}">${ring('boss', pics, open.has('boss') ? '' : 'locked')}<b>${esc(frameName('boss'))}</b><span>Одна на сервер</span></div>`;
  const specials = GD.frames.filter(f => f.ach).map(f => {
    const on = open.has(f.id);
    return `<${on ? 'button type="button" data-frame="' + f.id + '"' : 'div'} class="rstep${on ? '' : ' lock'}">${ring(f.id, pics, on ? '' : 'locked')}<b>${esc(frameName(f.id))}</b><span>${on ? 'Открыта' : esc(fill('За «%a»', { a: achName(f.ach) }))}</span></${on ? 'button' : 'div'}>`;
  }).join('');
  return `<div class="sec-h"><h2>Рамки и ранги</h2></div>
    <p>Ранг растёт от очков достижений, каждый ранг открывает свою рамку портрета. Особые рамки — только за особые достижения. Носить можно любую открытую: нажмите на неё.</p>
    <div class="ladder">${ladder}</div><div class="specials">${specials}</div><p class="msg" id="frNote" role="status"></p>`;
}
const REP_FIELD = { name: 'report_name', other: 'report_other' };
function secReports() {
  const head = `<div class="sec-h"><h2>${esc(tg('tab_reports'))}</h2></div>`;
  if (reps === null) return head + '<div class="skel" style="min-height:120px"></div>';
  if (!reps.length) return head + `<p>${esc(tg('reports_empty'))}</p>`;
  return head + reps.map(g => {
    const now = g.field === 'name' ? g.name : null;
    const key = `data-t="${esc(g.target)}" data-f="${esc(g.field)}"`;
    const what = tg(REP_FIELD[g.field] || 'report_other');
    const last = `<button type="button" class="btn danger" data-act="repBan" ${key}>${esc(tg('rep_ban'))}</button>`;
    return `<div class="g-rep"><h3><a href="${esc(playerUrl(g.target))}">${esc(g.name || g.target)}</a> · ${esc(what)} · ${esc(tg('reports_n', { n: g.n }))}</h3>
      <p>${esc(g.reasons.join('; '))}</p>${now ? `<p>${esc(tg('rep_now', { x: now }))}</p>` : ''}
      <div class="row"><button type="button" class="btn ghost" data-act="repKeep" ${key}>${esc(tg('rep_keep'))}</button>${g.field === 'other' ? '' : `<button type="button" class="btn ghost" data-act="repHide" ${key}>${esc(tg('rep_hide'))}</button>`}${last}</div></div>`;
  }).join('') + '<p class="msg" id="repNote" role="alert"></p>';
}
function loadReps() {
  if (repsLoading) return;
  repsLoading = true;
  M.api('/admin/reports').then(r => { reps = r.items || []; }, () => { reps = []; }).finally(() => { repsLoading = false; if (m && sec === 'reports') cabinet(); });
}
function resolveRep(b, action) {
  if (action === 'ban' && !confirm(tg('rep_ban_ask'))) return;
  b.disabled = true;
  M.api('/admin/reports/resolve', { body: { target: b.dataset.t, field: b.dataset.f, action } }).then(() => { reps = null; cabinet(); }, e => { b.disabled = false; const n = $('#repNote'); if (n) { n.textContent = errText(e); n.className = 'msg err'; } });
}

function secAccount() {
  const on = M.sound();
  return `<div class="sec-h"><h2>Аккаунт</h2></div>
    <div class="frame box"><label class="chk"><input type="checkbox" id="aSound"${on ? ' checked' : ''}>Звук при новом достижении</label></div>
    <div class="frame box"><h3>Ссылка для друга</h3><p class="small">Друг входит по ней — вам засчитывается «Вербовщик». Сейчас по вашей ссылке: ${m.user.refs || 0}.</p>
      <div class="row"><input id="aRef" readonly value="${esc(refUrl())}" aria-label="Ссылка для друга" style="flex:1 1 280px"><button type="button" class="btn ghost" data-act="copyRef">${ico('copy')}Скопировать</button></div><span class="msg" id="aRefNote" role="status"></span></div>
    <div class="frame box"><h3>Мои данные</h3><p class="small">Всё, что мы храним о вас, одним файлом JSON.</p><div class="row"><a class="btn ghost" href="${esc(M.API)}/me/export" download>Скачать мои данные</a></div></div>
    ${waysBox()}
    <div class="frame box"><h3>Выход и удаление</h3><p class="small">Выход завершает сессию на этом устройстве.</p>
      <div class="row"><button type="button" class="btn ghost" data-act="logout">Выйти</button><button type="button" class="btn danger" data-act="delete">Удалить профиль и все данные</button></div></div>`;
}
/** Account → ways to sign in: one account, several logins; the last one cannot be removed. */
function waysBox() {
  tgConfig();   // the Telegram link button must open its window right in the click, so the bot id is fetched in advance
  const ids = m.identities || [];
  const rows = WAYS.map(([id, n]) => {
    const on = ids.includes(id);
    const act = on ? (ids.length > 1 ? `<button type="button" class="btn ghost" data-act="unlink" data-p="${id}">Отвязать</button>` : '<span class="small">Единственный вход</span>')
      : wayBtn(id, 'Привязать', true).replace(/<svg.*?<\/svg>/, '').replace(' way"', '"');
    return `<div class="it">${wayIco(id)}<b>${esc(n)}</b><span class="sp"></span>${act}</div>`;
  }).join('');
  return `<div class="frame box"><h3>Способы входа</h3><p class="small">Аккаунт один — входите любым привязанным способом.</p>
    <div class="idl">${rows}</div>${mailForm()}<p class="msg" id="idNote" role="status"></p></div>`;
}

/** Selector of the control that has focus inside the cabinet (stable data keys), to find its twin after a redraw. */
function focusKey() {
  const el = document.activeElement;
  if (!el || !el.closest || !el.closest('#view')) return '';
  const d = el.dataset || {};
  if (d.act) return `[data-act="${d.act}"]`;
  if (d.frame) return `[data-frame="${d.frame}"]`;
  return el.id ? '#' + el.id : '';
}
function restoreFocus(sel) {
  const t = sel && $(sel);
  if (t && !t.disabled) t.focus({ preventScroll: true });
}
function cabinet() {
  const keep = focusKey();
  parkForm();
  const c = mainOf(), p = asPlayer(c);
  const ach = m.achievements.length, all = GD.ach.length;
  if (!secs().some(x => x[0] === sec)) sec = 'chars';
  const nav = secs().map(([id, t]) => `<a href="#${id}"${sec === id ? ' aria-current="page"' : ''}>${esc(t)}${id === 'chars' ? `<span>${esc(fill('%n из %m', { n: m.characters.length, m: CHAR_MAX }))}</span>` : id === 'ach' ? `<span>${ach} / ${all}</span>` : ''}</a>`).join('');
  const body = { chars: secChars, look: secLook, ach: secAch, frames: secFrames, account: secAccount, reports: secReports }[sec]();
  $('#view').innerHTML = `${noticeHtml()}<p class="lab">Карточка — как вас видят другие</p>${bcard(p, { h: 'h2', reveal })}${levelAsk()}${nextHtml()}${playHint()}${pathHtml()}
    <div class="lay"><nav class="frame pnav" aria-label="Кабинет">${nav}<hr><a class="pub" href="${playerUrl(m.user.id)}">Моя страница ↗</a></nav><section class="sec" id="sec">${body}</section></div>`;
  reveal = false;
  restoreFocus(keep);
  if (sec === 'reports' && reps === null) loadReps();
}

function render() {
  if (!m) return screen('login');
  if (!m.characters.length) return sec === 'account' ? accountOnly() : wizard();
  cabinet();
}

function put(body, noteId) {
  return M.api('/me', { method: 'PUT', body }).then(r => M.took(r), e => { const n = $('#' + noteId); if (n) { n.textContent = errText(e); n.className = 'msg err'; } });
}

/* clicks of the cabinet: one listener, the view is redrawn on every change of /me */
document.addEventListener('click', e => {
  if (!m || !e.target.closest('#view')) return;
  const t = e.target;
  const lb = t.closest('[data-look]');
  if (lb) { e.stopPropagation(); return lkOpen(m.characters.find(x => x.id === +lb.dataset.look)); }
  const editCard = t.closest('[data-edit]');
  if (editCard) return openEd(m.characters.find(c => c.id === +editCard.dataset.edit));
  const nav = t.closest('.pnav a[href^="#"]');
  if (nav) { e.preventDefault(); sec = nav.getAttribute('href').slice(1); history.replaceState(null, '', '#' + sec); cabinet(); $('#sec').scrollIntoView({ block: 'nearest' }); return; }
  const fr = t.closest('[data-frame]');
  if (fr) return put({ frame: fr.dataset.frame }, sec === 'look' ? 'lookNote' : 'frNote');
  const ct = t.closest('[data-cat]');
  if (ct) { cat = ct.dataset.cat; return cabinet(); }
  const lg = t.closest('#lfgSeg button');
  if (lg) return M.api('/me/lfg', { method: 'PUT', body: { kind: lg.dataset.v || null } }).then(r => M.took(r), () => {});
  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'add') openEd(null);
  else if (act === 'edit') openEd(mainOf());
  else if (act === 'radio') { const r = $('.radiobtn'); if (r) r.click(); }
  else if (act === 'account') { sec = 'account'; history.replaceState(null, '', '#account'); cabinet(); }
  else if (act === 'card') copyText(myUrl()).then(ok => { if (ok) M.track('show_card'); a.textContent = ok ? 'Скопировано' : myUrl(); });
  else if (act === 'copyRef') copyText(refUrl()).then(ok => { $('#aRefNote').textContent = ok ? 'Скопировано' : 'Не удалось скопировать, выделите ссылку и скопируйте вручную'; });
  else if (act === 'repKeep' || act === 'repHide' || act === 'repBan') resolveRep(a, { repKeep: 'keep', repHide: 'hide', repBan: 'ban' }[act]);
  else if (act === 'lfgMore') M.api('/me/lfg', { method: 'PUT', body: { kind: a.dataset.v } }).then(r => M.took(r), () => {});
  else if (act === 'lvl') {
    const c = mainOf();
    a.disabled = true;
    M.api('/characters/' + c.id, { method: 'PUT', body: Object.assign({}, c, { level: +a.dataset.lvl }) }).then(r => M.took(r), () => { a.disabled = false; });
  } else if (act === 'unlink') {
    a.disabled = true;
    M.api('/me/identities/' + a.dataset.p, { method: 'DELETE' }).then(() => M.me(true), e2 => { a.disabled = false; const n = $('#idNote'); if (n) { n.textContent = errText(e2); n.className = 'msg err'; } });
  } else if (act === 'logout') M.api('/auth/logout', { body: {} }).then(() => M.forget(), () => M.forget());
  else if (act === 'delete') openDelete();
});
document.addEventListener('change', e => {
  if (!m) return;
  if (e.target.id === 'lNick') put({ show_nick: e.target.checked }, 'lookNote');
  else if (e.target.id === 'aSound') M.sound(e.target.checked);
});
document.addEventListener('keydown', e => {
  const card = e.target.closest && e.target.closest('[data-edit]');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); }
});

function openDelete() {
  const d = $('#delDlg');
  $('#delW').textContent = DEL_WORD; $('#delWord').value = ''; $('#delGo').disabled = true; $('#delNote').textContent = '';
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  $('#delWord').focus();
}
$('#delWord').addEventListener('input', e => { $('#delGo').disabled = e.target.value.trim().toLocaleUpperCase(HL) !== DEL_WORD.toLocaleUpperCase(HL); });
$('#delNo').onclick = () => $('#delDlg').close();
$('#delGo').onclick = () => {
  $('#delGo').disabled = true;
  M.api('/me', { method: 'DELETE' }).then(() => { $('#delDlg').close(); M.forget(); }, e => { $('#delNote').textContent = errText(e); $('#delGo').disabled = false; });
};

function start() {
  $('#view').innerHTML = '<div class="skel" style="min-height:250px"></div>';
  M.api('/me').then(r => M.took({ me: r }), e => { if (e.status !== 401) screen('down'); });
}

/** Subscribes the page to /me (once); fresh: ask the API again, e.g. right after signing in. */
let following = false;
function follow(fresh) {
  if (following) { M.me(true); return; }
  following = true;
  let got = false;
  M.onMe(state => {
    got = true;
    const was = lastRank, idx = id => GD.ranks.findIndex(r => r.id === id);
    m = state;
    if (m) { reveal = was !== null && idx(m.user.rank) > idx(was); lastRank = m.user.rank; }
    if (!m) { closeEd(); reps = null; }
    render();
  });
  // me.js keeps quiet when the API is unreachable: ask once more to tell «logged out» (401) from «server down»
  M.me(fresh).then(() => {
    if (!got) M.api('/me').then(r => M.took({ me: r }), e => { if (e.status !== 401) screen('down'); });
  });
}

ready(Mx => {
  M = Mx;
  const ref = new URLSearchParams(location.search).get('ref');
  if (ref && REF.test(ref)) try { localStorage.setItem('gabella-ref', ref); } catch (e) { /* private mode */ }
  const h = location.hash.slice(1);
  if (SECS0.some(s => s[0] === h) || h === 'reports') sec = h;   // «reports» is checked against m.admin when the cabinet is drawn
  if (!M) return screen('down');
  wireForm();
  // one-time hashes: the email token, Telegram's answer without a popup, messages after a redirect
  const once = /^(email=|tgAuthResult=)/.test(h) || STATES[h] || h === 'not-member';
  if (once) history.replaceState(null, '', location.pathname + location.search);
  if (h.startsWith('email=')) return mailVerify(h.slice(6));
  if (h.startsWith('tgAuthResult=')) return tgFromHash(h.slice(13));
  if (STATES[h]) notice = h;
  addEventListener('hashchange', () => {
    const s2 = location.hash.slice(1);
    if (!secs().some(x => x[0] === s2) || !m) return;
    if (!m.characters.length) { sec = s2 === 'account' ? 'account' : 'chars'; render(); scrollTo(0, 0); return; }
    sec = s2; cabinet(); $('#sec').scrollIntoView({ block: 'nearest' });
  });
  follow();
});
</script>

<!-- «Мой профиль»: login, the first-run wizard, the cabinet. Fragment of me.src.html, built by build_me.py into profile/. -->
<style>
.pf { display: grid; gap: 18px; }
.pf .lab { margin: 0 0 8px; line-height: 1.4; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--gold-2); }
.login { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 28px; align-items: center; padding: 28px 30px; }
.login h2 { font-size: 1.7rem; margin-bottom: 6px; }
.login p { margin: 0; color: var(--muted); max-width: 62ch; }
.login ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
.login ul li::marker { color: var(--gold); }
.next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.nx { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; align-content: start; padding: 14px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); }
.nx .ic { grid-row: 1 / 3; width: 44px; height: 44px; border-radius: 8px; padding: 3px; background: linear-gradient(145deg, #f0d58c, #7a5a1c 55%, #c9a54a); }
.nx .ic img { width: 100%; height: 100%; border-radius: 6px; display: block; object-fit: cover; }
.nx b { font-weight: 600; }
.nx p { margin: 0; font-size: .85rem; color: var(--muted); }
.nx .prog { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: .78rem; color: var(--muted); margin-top: 6px; }
.nx .prog .bar { flex: 1; height: 4px; }
.nx .go { grid-column: 1 / -1; justify-self: start; margin-top: 8px; min-height: 40px; padding: 0 14px; font-size: .9rem; }
.path { display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 12px 18px; font-size: .92rem; color: var(--muted); }
.path b { color: var(--fg); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.ask { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 18px; }
.ask span { flex: 1 1 260px; }
.lay { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.pnav { position: sticky; top: calc(var(--top) + 16px); display: grid; gap: 2px; padding: 8px; }
.pnav a { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; padding: 0 14px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
:root[data-theme="light"] .pnav a { color: var(--muted); }
.pnav a:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); }
.pnav a[aria-current] { background: var(--panel-2); color: var(--fg); box-shadow: inset 2px 0 0 var(--gold); }
.pnav a span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pnav hr { border: 0; border-top: 1px solid var(--pline); margin: 6px 8px; }
.pnav .pub { color: var(--gold-2); }
.sec { display: grid; gap: 14px; min-width: 0; }
.sec > p { margin: 0; color: var(--muted); max-width: 70ch; }
.plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.plist .pcard { cursor: pointer; text-align: left; font: inherit; color: inherit; }
.plist .pcard:hover { border-color: var(--gold); }
.plist .pcard.main { border-color: color-mix(in srgb, var(--gold) 70%, transparent); }
.add { display: grid; place-items: center; align-content: center; gap: 6px; min-height: 130px; border: 1px dashed var(--line-2); border-radius: 10px; color: var(--muted); background: none; font: inherit; cursor: pointer; }
.add:hover { border-color: var(--gold); color: var(--fg); }
.add b { color: var(--fg); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.box { display: grid; gap: 12px; padding: 18px 20px; }
.box h3 { font-family: var(--font-body); font-size: 1.05rem; font-weight: 600; letter-spacing: 0; }
.box .small { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
.form label, .form .fl { display: grid; gap: 6px; font-size: .9rem; color: var(--muted); font-weight: 500; min-width: 0; }
.form .full { grid-column: 1 / -1; }
.form input:not([type="checkbox"]), .form select, .box input:not([type="checkbox"]), .box select { min-height: 46px; width: 100%; border-radius: 8px; border: 1px solid var(--pline); background: var(--panel-2); color: var(--fg); padding: 0 12px; font: inherit; font-size: 1rem; }
.form input:focus, .form select:focus, .box input:focus, .box select:focus { outline: none; border-color: var(--gold); }
.form .seg { justify-self: start; }
.form .pair { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; }
.chk { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--fg); font-weight: 500; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--gold); flex: none; }
.frames { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.bgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.bgs button { position: relative; aspect-ratio: 16 / 9; padding: 0; overflow: hidden; border: 1px solid var(--pline); border-radius: 8px; background: #0b0d12; cursor: pointer; }
.bgs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bgs span { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 8px 5px; font-size: .74rem; color: #ece6d8; background: linear-gradient(transparent, rgba(0,0,0,.8)); text-align: left; }
.bgs button[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.cats button { display: grid; gap: 6px; padding: 12px 14px; text-align: left; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); color: var(--fg); font: inherit; cursor: pointer; }
.cats button[aria-pressed="true"] { border-color: var(--gold); }
.cats b { font-weight: 600; font-size: .95rem; }
.cats span { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cats .bar { height: 4px; }
/* wizard */
.wiz { display: grid; gap: 16px; padding: 22px 24px; }
.wiz .wsteps { display: flex; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.wiz .wsteps span[aria-current] { color: var(--gold-2); font-weight: 600; }
.wiz h2 { font-size: 1.7rem; }
.facs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.facs button { position: relative; min-height: 200px; overflow: hidden; isolation: isolate; display: grid; align-content: end; padding: 18px; border: 1px solid var(--pline); border-radius: 10px; background: #0b0d12; color: #f1ece0; text-align: left; font: inherit; cursor: pointer; }
.facs img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; z-index: -2; filter: brightness(.6); transition: filter .3s; }
.facs button::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(transparent 40%, rgba(0,0,0,.75)); }
.facs button:hover img { filter: brightness(.8); }
.facs b { font-family: var(--font-display); font-size: 2rem; color: var(--fc); }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.picks button { display: grid; justify-items: center; gap: 8px; padding: 14px 8px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); color: var(--fg); font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; }
.picks button:hover { border-color: var(--gold); }
.picks button[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.picks .me-ring { --s: 64px; margin: 0; }
.picks small { color: var(--muted); font-weight: 500; }
.founder { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; align-items: center; padding: 14px 18px; }
.founder b { font-family: var(--font-display); font-size: 1.2rem; color: var(--gold-2); }
.founder p { margin: 2px 0 0; color: var(--muted); font-size: .92rem; }
.founder .fcd { font-family: var(--font-display); font-size: 1.9rem; line-height: 1; text-align: right; font-variant-numeric: lining-nums; }
.founder .fcd small { display: block; font-family: var(--font-body); font-size: .78rem; color: var(--muted); }
/* side panel: the character editor */
.side { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(520px, 100vw); padding: 0; border: 0; border-left: 1px solid var(--pline); background: var(--surface); color: var(--fg); }
.side::backdrop { background: rgba(0,0,0,.55); }
.side .dh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px 10px 20px; min-height: var(--top); background: var(--surface); border-bottom: 1px solid var(--line); }
.side .dh b { font-family: var(--font-display); font-size: 1.4rem; font-weight: 400; }
.side .form { padding: 20px; }
.side .act { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
.side .act .sp { flex: 1; }
.cdlg { width: min(460px, calc(100vw - 32px)); padding: 0; border: 1px solid var(--pline); border-radius: 12px; background: var(--surface); color: var(--fg); }
.cdlg::backdrop { background: rgba(0,0,0,.6); }
.cdlg .in { display: grid; gap: 12px; padding: 22px; }
.cdlg h2 { font-size: 1.5rem; }
.cdlg p { margin: 0; color: var(--muted); }
.cdlg input { min-height: 46px; border-radius: 8px; border: 1px solid var(--pline); background: var(--panel-2); color: var(--fg); padding: 0 12px; font: inherit; }
/* growth: Glory, weekly tasks, season track, name colour, showcase, chronicle, reports */
.g-box { padding: 14px 18px; }
#wkNote:empty { display: none; }
.g-tasks { display: grid; gap: 8px; }
.g-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0; color: var(--muted); font-size: .9rem; }
.g-meta b { color: var(--fg); font-weight: 600; font-variant-numeric: lining-nums tabular-nums; }
.g-go, .g-swap { min-height: 40px; padding: 0 14px; font-size: .9rem; }
.s-sec { display: grid; gap: 12px; }
.s-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
.s-head b { font-weight: 600; color: var(--gold-2); font-variant-numeric: lining-nums tabular-nums; }
.s-head span { color: var(--muted); font-size: .9rem; }
.s-head .g-bar { flex: 1 1 140px; align-self: center; }
.s-track { display: flex; margin: 0; padding: 4px 2px 10px; list-style: none; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: thin; }
.s-step { position: relative; flex: none; width: 48px; display: grid; justify-items: center; align-content: start; gap: 4px; }
.s-step::before { content: ""; position: absolute; top: 19px; left: -50%; right: 50%; height: 2px; background: var(--pline); }
.s-step:first-child::before { display: none; }
.s-step.got::before { background: var(--gold); }
.s-dot { position: relative; z-index: 1; display: grid; place-items: center; height: 38px; }
.s-pt { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--panel-2); overflow: hidden; }
.s-pt.rw { width: 38px; height: 38px; border-radius: 8px; border-width: 1px; color: var(--gold-2); font-weight: 700; }
.s-pt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.s-pt .me-ring { --s: 34px; margin: 0; }
.s-step:not(.got) .s-pt.rw { opacity: .6; }
.s-step.got .s-pt { background: var(--gold); border-color: var(--gold); }
.s-step.got .s-pt.rw { background: var(--panel-2); }
.s-step.next .s-pt { border-color: var(--gold-2); }
.s-step i { font-style: normal; font-size: .74rem; color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.s-step.got i, .s-step.next i { color: var(--gold-2); }
.g-colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 100%), 1fr)); gap: 8px; }
.g-sw { display: grid; gap: 2px; min-width: 0; padding: 12px 14px; text-align: left; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); color: var(--fg); font: inherit; cursor: pointer; }
.g-sw b { font-size: 1.05rem; overflow-wrap: anywhere; }
.g-sw small { color: var(--muted); }
.g-sw:hover:not(:disabled) { border-color: var(--gold); }
.g-sw[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.g-sw:disabled { cursor: not-allowed; }
.g-sw:disabled b { color: var(--muted); }
.g-show { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.g-cell { display: grid; justify-items: center; align-content: start; gap: 6px; min-width: 0; padding: 12px 6px 8px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); text-align: center; font-size: .8rem; }
.g-cell img { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; display: block; }
.g-cell b { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.g-cell.empty { place-items: center; align-content: center; min-height: 112px; border-style: dashed; background: none; color: var(--muted); }
.g-cell[draggable="true"] { cursor: grab; }
.g-cell.drag { opacity: .45; }
.g-cell.over { border-color: var(--gold); }
.g-ctl { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.g-ctl button { min-width: 38px; min-height: 38px; border: 1px solid var(--pline); border-radius: 8px; background: none; color: var(--fg); font: inherit; cursor: pointer; }
.g-ctl button:hover { border-color: var(--gold); }
.g-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.g-pick select { flex: 1 1 220px; width: auto; min-width: 0; }
.g-rep { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--pline); border-radius: 10px; background: var(--panel-2); }
.g-rep h3 { font-family: var(--font-body); font-size: 1rem; font-weight: 600; letter-spacing: 0; overflow-wrap: anywhere; }
.g-rep p { margin: 0; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.g-rep .row .btn { min-height: 40px; padding: 0 14px; font-size: .9rem; }
@media (max-width: 700px) { .g-show { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); } }
@media (max-width: 1100px) { .next { grid-template-columns: 1fr; } }
@media (max-width: 960px) {
  .lay { grid-template-columns: 1fr; }
  .pnav { position: static; display: flex; overflow-x: auto; }
  .pnav hr { display: none; }
  .pnav a { white-space: nowrap; }
  .plist { grid-template-columns: 1fr; }
  .login, .founder { grid-template-columns: 1fr; }
  .founder .fcd { text-align: left; }
}
@media (max-width: 600px) {
  .form, .facs { grid-template-columns: 1fr; }
  .side { width: 100vw; }
}
@media (prefers-reduced-motion: reduce) { .facs img { transition: none; } }
</style>

<main class="wrap pg-top pf" id="app">
  <h1 class="sr">Мой профиль</h1>
  <div id="view"><div class="skel" style="min-height:250px"></div></div>
</main>

<dialog class="side" id="edDlg" aria-labelledby="edT">
  <div class="dh"><b id="edT">Персонаж</b><button class="iconbtn" id="edClose" type="button" aria-label="Закрыть"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg></button></div>
  <form class="form" id="edForm" novalidate>
    <label class="full">Имя<input id="eName" maxlength="12" autocomplete="off" spellcheck="false" required></label>
    <div class="fl full"><span id="leF">Фракция</span><div class="seg" id="eF" aria-labelledby="leF"><button type="button" data-v="alliance">Альянс</button><button type="button" data-v="horde">Орда</button></div></div>
    <label>Раса<select id="eRace"></select></label>
    <label>Класс<select id="eCls"></select></label>
    <div class="fl"><span id="leRole">Роль</span><div class="seg" id="eRole" aria-labelledby="leRole"></div></div>
    <label>Уровень<input id="eLvl" type="number" min="1" max="60" inputmode="numeric" value="1"></label>
    <div class="fl full"><span id="leT">Когда играете</span><div class="seg" id="eT" aria-labelledby="leT"><button type="button" data-v="morning">Утро</button><button type="button" data-v="evening">Вечер</button><button type="button" data-v="night">Сова</button></div></div>
    <div class="fl"><span>Профессия 1</span><div class="pair"><select id="eP1" aria-label="Профессия 1"></select><input id="eS1" type="number" min="1" max="300" inputmode="numeric" placeholder="1–300" aria-label="Навык профессии 1"></div></div>
    <div class="fl"><span>Профессия 2</span><div class="pair"><select id="eP2" aria-label="Профессия 2"></select><input id="eS2" type="number" min="1" max="300" inputmode="numeric" placeholder="1–300" aria-label="Навык профессии 2"></div></div>

    <div class="act"><button type="submit" class="btn" id="eSave">Сохранить</button><button type="button" class="btn ghost" id="eMain">Сделать основным</button><span class="sp"></span><button type="button" class="btn danger" id="eDel">Удалить персонажа</button></div>
  </form>
</dialog>

<dialog class="cdlg" id="delDlg" aria-labelledby="delT">

    <h2 id="delT">Удалить профиль</h2>

    <label class="small" for="delWord">Чтобы подтвердить, введите слово <b id="delW">УДАЛИТЬ</b></label>
    <input id="delWord" autocomplete="off" spellcheck="false">
    <p class="msg err" id="delNote" role="alert"></p>
    <div class="row"><button type="button" class="btn danger" id="delGo" disabled>Удалить навсегда</button><button type="button" class="btn ghost" id="delNo">Отмена</button></div>
  </form>
</dialog>

<script>
/* ---------- Profile: login, first-run wizard, cabinet sections in the hash, the character editor ---------- */
const ERR = {
  bad_name: 'Имя: от 2 до 12 букв, без цифр и пробелов.', bad_race: 'Выберите расу.', bad_combo: 'Такого сочетания расы и класса нет.',
  bad_role: 'Эта роль классу недоступна.', bad_level: 'Уровень — от 1 до 60.', bad_prof: 'Две разные профессии из списка.',
  bad_skill: 'Навык — от 1 до 300 и только у выбранной профессии.', bad_playtime: 'Выберите, когда играете.', limit: 'Не больше трёх персонажей.',
  bad_motto: 'Девиз — до 60 знаков.', locked: 'Это ещё не открыто.', auth: 'Сессия закончилась, войдите снова.',
};
/** Text of an API error code: the growth texts (err_<code>: bad_word, no_links, swap_used, task_done, bad_showcase) first, then ERR. */
const errText = e => {
  const c = e && e.code;
  return (c && T.g && T.g['err_' + c]) || ERR[c] || 'Не получилось сохранить. Попробуйте ещё раз.';
};
const SECS0 = [['chars', 'Персонажи'], ['look', 'Внешний вид'], ['ach', 'Достижения'], ['frames', 'Рамки и ранги'], ['chronicle', 'Хроника'], ['account', 'Аккаунт']];
const secs = () => (m && m.admin ? SECS0.concat([['reports', tg('tab_reports')]]) : SECS0);   // «Reports» is for the admin only
const DEL_WORD = 'УДАЛИТЬ';
const FIRST = ['profile_full', 'radio_on', 'guides3', 'party5', 'play_page'];
const ACT = {
  guide: ['Открыть гайды', 'guides/'], class: ['Открыть классы', 'classes/'], race: ['Открыть расы', 'races/'], play_page: ['Открыть «В игре»', 'play/'],
  party5: ['Собрать группу', 'tools/#raid'], raid40: ['Собрать рейд', 'tools/#raid'], share_team: ['Собрать группу', 'tools/#raid'],
  compare3: ['Сравнить', 'tools/#compare'], search: ['Искать', 'tools/#search'], lang: ['Сменить язык', null],
  radio_on: ['Включить радио', 'radio'], radio_min: ['Включить радио', 'radio'], station: ['Включить радио', 'radio'], sleep_timer: ['Включить радио', 'radio'],
  show_card: ['Скопировать ссылку', 'card'], three_chars: ['Добавить персонажа', 'add'], profile_full: ['Заполнить персонажа', 'edit'],
  recruiter1: ['Ссылка для друга', 'account'], recruiter5: ['Ссылка для друга', 'account'],
};
let M = null, m = null, sec = 'chars', cat = '', wiz = null, edit = null, lastRank = null, reveal = false;
const newChron = () => ({ items: [], more: false, loaded: false, loading: false });
let chron = newChron(), reps = null, repsLoading = false, dragFrom = -1;

const mainOf = () => m.characters.find(c => c.is_main) || m.characters[0];
const have = () => new Map(m.achievements.map(a => [a.id, a]));
const ctx = () => ({ progress: m.progress, user: m.user, chars: m.characters, have: new Set(m.achievements.map(a => a.id)) });
const asPlayer = c => ({ id: m.user.id, nick: m.user.show_nick ? m.user.nick : null, title: m.user.title, frame: m.user.frame, rank: m.user.rank,
  portrait: m.user.portrait, background: m.user.background, motto: m.user.motto, points: m.user.points, joined: m.user.joined_guild_at, main: c,
  name_color: m.user.name_color });
const myUrl = () => new URL(playerUrl(m.user.id), location.href).href;
const refUrl = () => new URL(`${HOME}profile/?ref=${m.user.id}`, location.href).href;
function loginUrl() {
  let ref = '';

/* ---------- screens before the cabinet ---------- */
function screen(kind) {
  parkForm();
  const v = $('#view');
  if (kind === 'login') {
    v.innerHTML = `<section class="frame login"><div><h2>Войдите через Discord</h2>
      <p>Профили только для участников сервера Gabella Team. Мы получаем ваш Discord ID и проверяем участие в сервере, больше ничего.</p>
      <ul><li>До трёх персонажей, основной виден в «Составе».</li><li>Достижения, ранги и рамки портрета.</li><li>Титул «Основатель» — для тех, кто успеет до старта 4 ноября.</li></ul></div>
      <a class="btn lg dsc" href="${esc(loginUrl())}">${DISCORD}Войти через Discord</a></section>`;
  } else if (kind === 'not-member') {
    v.innerHTML = `<section class="frame state"><h2>Вы не участник сервера</h2><p>Профили только для участников Discord-сервера Gabella Team. Вступите в сервер и войдите ещё раз.</p>
      <div class="row">${GD.invite ? `<a class="btn" href="${esc(GD.invite)}" target="_blank" rel="noopener">Вступить в Gabella Team</a>` : ''}<a class="btn ghost" href="${esc(loginUrl())}">Войти ещё раз</a></div></section>`;
  } else if (kind === 'members-only') {   // OPEN_LOGIN is off: only members of the Discord server get in (R11)
    v.innerHTML = `<section class="frame state"><h2>Вход</h2><p>${esc(tg('err_members_only'))}</p>
      <div class="row">${GD.invite ? `<a class="btn" href="${esc(GD.invite)}" target="_blank" rel="noopener">Вступить в Gabella Team</a>` : ''}<a class="btn ghost" href="${esc(loginUrl())}">Войти ещё раз</a></div></section>`;
  } else if (kind === 'discord-down') {
    v.innerHTML = `<section class="frame state"><h2>Discord не отвечает</h2><p>Не удалось проверить вход. Попробуйте через пару минут.</p>
      <div class="row"><a class="btn" href="${esc(loginUrl())}">Попробовать снова</a></div></section>`;
  } else {
    v.innerHTML = `<section class="frame state"><h2>Сервер профилей не отвечает</h2><p>Попробуйте через пару минут. Остальной гид работает как обычно.</p>
      <div class="row"><button type="button" class="btn ghost" id="retry">Повторить</button></div></section>`;

/* ---------- first run: faction -> race and class -> the rest ---------- */
function founderPlaque() {
  const ms = Date.parse(GD.deadline) - Date.now();
  if (ms <= 0) return '';
  const days = Math.ceil(ms / 86400000);
  return `<div class="frame founder"><div><b>Титул «Основатель»</b><p>Добавьте персонажа до старта 4 ноября — титул и золотая рамка останутся навсегда.</p></div>
    <div class="fcd">${unit(days, 'day')}<small>до закрытия окна</small></div></div>`;
}
function wizard() {
  parkForm();
  wiz = wiz || { step: 1, f: '', race: '', cls: '' };
  const w = wiz, v = $('#view');
  const steps = ['Сторона', 'Раса и класс', 'Персонаж'].map((s, i) => `<span${w.step === i + 1 ? ' aria-current="step"' : ''}>${i + 1}. ${esc(s)}</span>`).join('<span aria-hidden="true">·</span>');
  let body = '';
  if (w.step === 1) {
    body = `<h2>За кого играете?</h2><div class="facs">${['alliance', 'horde'].map(f => `<button type="button" data-f="${f}" style="--fc:var(--${f})">
      <img src="${ROOT}assets/art/${f === 'alliance' ? 'human' : 'orc'}-600.webp" alt="" loading="lazy"><b>${esc(FACN[f])}</b></button>`).join('')}</div>`;
  } else if (w.step === 2) {
    const races = Object.entries(GD.races).filter(([, r]) => r.f === w.f);
    const cl = w.race ? race(w.race).cls : [];
    body = `<h2>Раса и класс</h2><div class="picks" role="group" aria-label="Раса">${races.map(([id, r]) => `<button type="button" data-race="${id}" aria-pressed="${w.race === id}">${ring('recruit', `${ROOT}assets/art/${r.slug}-face.webp`)}${esc(r.n)}</button>`).join('')}</div>
      ${w.race ? `<div class="picks" role="group" aria-label="Класс">${cl.map(id => `<button type="button" data-cls="${id}" aria-pressed="${w.cls === id}" style="color:${cls(id).color}">${ring('recruit', `${ROOT}assets/art/${id}-face.webp`)}${esc(cls(id).n)}</button>`).join('')}</div>` : ''}
      <div class="row"><button type="button" class="btn ghost" data-back>Назад</button><button type="button" class="btn" data-next${w.race && w.cls ? '' : ' disabled'}>Дальше</button></div>`;
  } else {
    body = `<h2>Персонаж</h2><div id="wForm"></div><div class="row"><button type="button" class="btn ghost" data-back>Назад</button></div>`;
  }
  const c = { name: w.name || '…', race: w.race || (w.f === 'horde' ? 'orc' : 'human'), class: w.cls || 'warrior', level: w.level || 1, role: w.role || 'dps' };
  const prev = asPlayer(c);
  prev.title = Date.now() < Date.parse(GD.deadline) ? 'founder' : null;
  prev.frame = prev.title ? 'founder' : prev.frame;
  v.innerHTML = `<p class="lab">Так вас увидят в «Составе»</p>${bcard(prev, { h: 'h2' })}${founderPlaque()}
    <section class="frame wiz"><div class="wsteps">${steps}</div>${body}</section>`;
  if (w.step === 3) mountForm($('#wForm'), null);
}
document.addEventListener('click', e => {
  if (!wiz || !e.target.closest('.wiz')) return;
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.f) { wiz.f = b.dataset.f; wiz.race = ''; wiz.cls = ''; wiz.step = 2; }
  else if (b.dataset.race) { wiz.race = b.dataset.race; if (!race(wiz.race).cls.includes(wiz.cls)) wiz.cls = ''; }
  else if (b.dataset.cls) wiz.cls = b.dataset.cls;
  else if ('back' in b.dataset) wiz.step--;
  else if ('next' in b.dataset) wiz.step++;
  else return;
  wizard();
});

/* ---------- the character form: in the wizard and in the side panel ---------- */
/** The wizard borrows the side panel's form (the dialog is closed then); every redraw of the view parks it back first. */
function mountForm(host, c) {
  host.append($('#edForm'));
  fillForm(c, true);
}
function segSet(id, v) { $$(`#${id} button`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); }
function segVal(id) { const b = $(`#${id} [aria-pressed="true"]`); return b ? b.dataset.v : ''; }
function fillRaces(f, keep) {
  const list = Object.entries(GD.races).filter(([, r]) => r.f === f);
  $('#eRace').innerHTML = list.map(([id, r]) => `<option value="${id}">${esc(r.n)}</option>`).join('');
  if (keep && list.some(([id]) => id === keep)) $('#eRace').value = keep;
}
function fillClasses(keep) {
  const cl = race($('#eRace').value).cls;
  $('#eCls').innerHTML = cl.map(id => `<option value="${id}">${esc(cls(id).n)}</option>`).join('');
  if (keep && cl.includes(keep)) $('#eCls').value = keep;
}
function fillRoles(keep) {
  const roles = cls($('#eCls').value).roles;
  $('#eRole').innerHTML = roles.map(r => `<button type="button" data-v="${r}">${esc(ROLE[r])}</button>`).join('');
  segSet('eRole', roles.includes(keep) ? keep : roles[0]);
}
function fillProfs() {
  const opts = '<option value="">Нет</option>' + Object.entries(GD.profs).map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
  $('#eP1').innerHTML = opts; $('#eP2').innerHTML = opts;
}
function skillState() { ['1', '2'].forEach(i => { const on = !!$('#eP' + i).value; $('#eS' + i).disabled = !on; if (!on) $('#eS' + i).value = ''; }); }
function fillForm(c, wizardMode) {
  edit = c ? c.id : null;
  const w = wizardMode && !c ? wiz : null;
  const f = c ? race(c.race).f : w ? w.f : 'alliance';
  segSet('eF', f); fillRaces(f, c ? c.race : w && w.race); fillClasses(c ? c.class : w && w.cls); fillRoles(c ? c.role : 'dps'); fillProfs();
  $('#eName').value = c ? c.name : (w && w.name) || '';
  $('#eLvl').value = c ? c.level : 1;
  segSet('eT', c ? c.playtime : 'evening');
  $('#eP1').value = c && c.prof1 || ''; $('#eP2').value = c && c.prof2 || '';
  $('#eS1').value = c && c.prof1_skill || ''; $('#eS2').value = c && c.prof2_skill || '';
  skillState();
  $('#eNote').textContent = ''; $('#eNote').className = 'msg full';
  $('#eMain').hidden = !c || !!c.is_main;
  $('#eDel').hidden = !c;
  $('#eSave').textContent = c ? 'Сохранить' : 'Создать персонажа';
  const nick = $('#eNick');
  if (nick) nick.closest('label').remove();
  if (!c && wizardMode) $('#eNote').insertAdjacentHTML('beforebegin', `<label class="chk full"><input type="checkbox" id="eNick" checked>Показывать мой ник из Discord в «Составе»</label>`);
  // the wizard's choices are made already: race and class stay editable, but the faction row is not needed there
  $('#eF').closest('.fl').hidden = !!wizardMode && !c;
  $('#eRace').closest('label').hidden = !!wizardMode && !c;
  $('#eCls').closest('label').hidden = !!wizardMode && !c;
}
function formBody() {
  const n = v => (v === '' ? null : +v);
  return {
    name: $('#eName').value.trim(), race: $('#eRace').value, class: $('#eCls').value, role: segVal('eRole'), level: +$('#eLvl').value,
    playtime: segVal('eT'), prof1: $('#eP1').value || null, prof2: $('#eP2').value || null, prof1_skill: n($('#eS1').value), prof2_skill: n($('#eS2').value),
  };
}
function check(b) {
  if (!/^\p{L}{2,12}$/u.test(b.name)) return 'bad_name';
  if (!Number.isInteger(b.level) || b.level < 1 || b.level > 60) return 'bad_level';
  if (b.prof1 && b.prof1 === b.prof2) return 'bad_prof';
  for (const s of [b.prof1_skill, b.prof2_skill]) if (s !== null && !(Number.isInteger(s) && s >= 1 && s <= 300)) return 'bad_skill';
  return null;
}
function note(text, bad) { $('#eNote').textContent = text; $('#eNote').className = 'msg full' + (bad ? ' err' : ''); }
function busy(on) { $$('#edForm button').forEach(b => { b.disabled = on; }); }

function wireForm() {
  $('#eF').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; segSet('eF', b.dataset.v); fillRaces(b.dataset.v); fillClasses(); fillRoles(segVal('eRole')); });
  $('#eRace').onchange = () => { fillClasses($('#eCls').value); fillRoles(segVal('eRole')); };
  $('#eCls').onchange = () => fillRoles(segVal('eRole'));
  $('#eRole').addEventListener('click', e => { const b = e.target.closest('button'); if (b) segSet('eRole', b.dataset.v); });
  $('#eT').addEventListener('click', e => { const b = e.target.closest('button'); if (b) segSet('eT', b.dataset.v); });
  $('#eP1').onchange = $('#eP2').onchange = skillState;
  $('#eName').addEventListener('input', () => { if (wiz) wiz.name = $('#eName').value.trim(); });
  $('#edForm').addEventListener('submit', e => {
    e.preventDefault();
    const b = formBody(), bad = check(b);
    if (bad) return note(ERR[bad], true);
    busy(true); note('');
    const nick = $('#eNick'), hideNick = nick && !nick.checked;
    const req = edit ? M.api('/characters/' + edit, { method: 'PUT', body: b }) : M.api('/characters', { body: b });
    req.then(r => (hideNick ? M.api('/me', { method: 'PUT', body: { show_nick: false } }).then(r2 => Object.assign(r, { me: r2.me })) : r))
      .then(r => { busy(false); if (!edit) { wiz = null; parkForm(); } closeEd(); M.took(r); },
        e2 => { busy(false); note(errText(e2), true); });
  });
  $('#eMain').onclick = () => { busy(true); M.api(`/characters/${edit}/main`, { body: {} }).then(r => { busy(false); closeEd(); M.took(r); }, e => { busy(false); note(errText(e), true); }); };
  $('#eDel').onclick = () => {
    const c = m.characters.find(x => x.id === edit);
    if (!c || !confirm(fill('Удалить персонажа %n? Его достижения останутся у вас.', { n: c.name }))) return;
    busy(true);
    M.api('/characters/' + edit, { method: 'DELETE' }).then(r => { busy(false); closeEd(); M.took(r); }, e => { busy(false); note(errText(e), true); });
  };
  $('#edClose').onclick = closeEd;
  $('#edDlg').addEventListener('click', e => { if (e.target === $('#edDlg')) closeEd(); });
}
function parkForm() { $('#edDlg').append($('#edForm')); }
function openEd(c) {
  parkForm();
  fillForm(c, false);
  $('#edT').textContent = c ? c.name : 'Новый персонаж';
  if ($('#edDlg').showModal) $('#edDlg').showModal(); else $('#edDlg').setAttribute('open', '');
  $('#eName').focus();
}
function closeEd() { if ($('#edDlg').open) $('#edDlg').close(); }

/* ---------- cabinet ---------- */
const fresh = () => m.achievements.length < 3;   // a newcomer: the first steps go first
function nextUp() {
  const h = have(), c = ctx(), out = [];
  for (const a of GD.ach) {
    if (h.has(a.id) || a.secret || a.kind === 'admin') continue;
    const key = a.rule && a.rule.key || a.id;
    if (!ACT[key]) continue;   // only what a button can move forward
    const pr = achProgress(a, c);
    out.push({ a, pr, pct: pr ? pr.v / pr.goal : 0, key });
  }
  out.sort((x, y) => y.pct - x.pct);
  if (fresh()) out.sort((x, y) => (FIRST.indexOf(x.a.id) + 1 || 99) - (FIRST.indexOf(y.a.id) + 1 || 99));
  return out.slice(0, 3);
}
function nextHtml() {
  const list = nextUp();
  if (!list.length) return '';
  return `<section aria-labelledby="nxH"><div class="sec-h"><h2 id="nxH">${fresh() ? 'Первые шаги' : 'Что дальше'}</h2></div><div class="next">${list.map(({ a, pr, key }) => {
    const act = ACT[key];
    let btn = '';
    if (act && act[1] === 'radio') btn = `<button type="button" class="btn ghost go" data-act="radio">${esc(act[0])}</button>`;
    else if (act && ['card', 'add', 'edit', 'account'].includes(act[1])) btn = `<button type="button" class="btn ghost go" data-act="${act[1]}">${esc(act[0])}</button>`;
    else if (act && act[1]) btn = `<a class="btn ghost go" href="${HOME}${act[1]}">${esc(act[0])}</a>`;
    const t = T.ach[a.id] || [a.id, ''];
    return `<div class="nx"><span class="ic"><img src="${achIcon(a.id)}" alt="" width="38" height="38"></span><b>${esc(t[0])}</b><p>${esc(t[1])}</p>
      ${pr ? `<span class="prog"><span class="bar"><i style="width:${Math.round(100 * pr.v / pr.goal)}%"></i></span>${esc(pr.text)}</span>` : ''}${btn}</div>`;
  }).join('')}</div></section>`;
}
function pathHtml() {
  const u = m.user, P = m.progress || {};
  const radio = Math.floor(((P.radio_min || {}).value || 0) / 60);
  const guides = ((P.guide || {}).items || []).filter(x => GD.sets.guide.includes(x)).length;
  const place = u.rank_place && u.rank_place.place ? fill('%p из %t', { p: u.rank_place.place, t: u.rank_place.total }) : '—';
  return `<div class="frame path" aria-label="Ваш путь"><span>Дней подряд: <b>${u.streak || 0}</b></span><span>Радио: <b>${unit(radio, 'hour')}</b></span>
    <span>Гайды: <b>${fill('%v из %g', { v: guides, g: GD.sets.guide.length })}</b></span><span>Место в команде: <b>${place}</b></span></div>`;
}
function levelAsk() {
  let lvl = 0;
  try { lvl = +(JSON.parse(localStorage.getItem('gabella-wf-me')) || {}).lvl || 0; } catch (e) { /* no level */ }
  const c = mainOf();

function secChars() {
  const n = m.characters.length;

/** Name colour: six samples of the main character's name; the ones above the Glory are grey with «From Glory N». */
function colorBox() {

/** Showcase item: an achievement (id) or a season badge (badge:<id>). */
const showName = id => (id.startsWith('badge:') ? tg('ch_badge') : achName(id));
const showIcon = id => achIcon(id.startsWith('badge:') ? id.slice(6) : id);
function showcaseList() { return (m.user.showcase || []).filter(x => typeof x === 'string'); }
/** Showcase: five cells, up/down/remove for each (and dragging with a mouse), a list to add from what is owned. */
function showcaseBox() {
  const list = showcaseList(), fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const cells = [];
  for (let i = 0; i < 5; i++) {
    const id = list[i];
    if (!id) { cells.push(`<li class="g-cell empty">${esc(tg('showcase_empty'))}</li>`); continue; }
    const n = esc(showName(id)), btn = (a, glyph, key, off) => `<button type="button" data-sh="${a}" data-i="${i}" aria-label="${esc(tg(key))}: ${n}"${off ? ' disabled' : ''}>${glyph}</button>`;
    cells.push(`<li class="g-cell" data-i="${i}"${fine ? ' draggable="true"' : ''}><img src="${showIcon(id)}" alt="" width="46" height="46" loading="lazy"><b>${n}</b>
      <span class="g-ctl">${btn('up', '↑', 'showcase_up', i === 0)}${btn('down', '↓', 'showcase_down', i === list.length - 1)}${btn('del', '×', 'showcase_del')}</span></li>`);
  }
  const owned = m.achievements.map(a => a.id).concat(m.unlocks.filter(x => x.startsWith('badge:'))).filter(id => !list.includes(id));
  const pick = owned.length && list.length < 5
    ? `<div class="g-pick"><select id="shPick" aria-label="${esc(tg('showcase_add'))}">${owned.map(id => `<option value="${esc(id)}">${esc(showName(id))}</option>`).join('')}</select>
      <button type="button" class="btn ghost" data-act="showAdd">${esc(tg('showcase_add'))}</button></div>` : '';
  return `<div class="frame box"><h3>${esc(tg('showcase'))}</h3><ul class="g-show">${cells.join('')}</ul><p class="small">${esc(tg('showcase_hint'))}</p>${pick}</div>`;
}
const saveShowcase = list => put({ showcase: list }, 'lookNote');
function moveShowcase(from, to) {
  const list = showcaseList();
  if (from < 0 || from >= list.length) return;
  to = Math.max(0, Math.min(to, list.length - 1));
  if (to === from) return;
  list.splice(to, 0, list.splice(from, 1)[0]);
  return saveShowcase(list);
}

function secFrames() {

/* ---------- growth blocks of the cabinet ---------- */
function gloryHtml() { return m.glory ? `<div class="frame g-box">${gloryBar(m.glory)}</div>` : ''; }

/** «3 d 4 h» until t. */
function until(t) {
  const mins = Math.max(1, Math.round((t - Date.now()) / 60000)), d = Math.floor(mins / 1440), h = Math.floor((mins % 1440) / 60);
  return d ? unit(d, 'day') + (h ? ' ' + unit(h, 'hour') : '') : h ? unit(h, 'hour') + (mins % 60 ? ' ' + unit(mins % 60, 'minute') : '') : unit(mins, 'minute');
}
const itemName = (k, item) => (k === 'station' ? (GD.items.station || {})[item] : k === 'guide' ? (GD.items.guide || {})[item] : null);
function weekHtml() {
  const w = m.week;
  if (!w) return '';   // before the first week
  const swap = w.swap_left > 0;
  const rows = w.tasks.map(t => taskLine(t, T.g, {
    itemName, extra: !t.done && swap ? `<button type="button" class="btn ghost g-swap" data-act="swap" data-task="${esc(t.id)}">${esc(tg('week_swap'))}</button>` : '',
  })).join('');
  return `<section aria-labelledby="wkH"><div class="sec-h"><h2 id="wkH">${esc(tg('week'))}</h2></div>
    <div class="frame box"><p class="g-meta"><span>${esc(tg('week_ends', { d: until(w.ends_at) }))}</span><span>${esc(tg('week_streak', { n: w.streak }))}</span></p>
    <div class="g-tasks">${rows}</div><p class="small">${esc(tg('week_all'))}</p>${!swap && w.tasks.some(t => !t.done) ? `<p class="small">${esc(tg('week_swap_used'))}</p>` : ''}
    <p class="msg" id="wkNote" role="alert"></p></div></section>`;
}

const rewardName = r => { const [k, id] = r.split(':'); return k === 'badge' ? tg('ch_badge') : k === 'bg' ? (T.bg || {})[id] || id : k === 'title' ? titleName(id) : frameName(id); };
function rewardThumb(r) {
  const [k, id] = r.split(':');
  if (k === 'badge') return `<img src="${ROOT}assets/me/ach/${esc(id)}.webp" alt="">`;
  if (k === 'bg') return `<img src="${ROOT}assets/art/${esc(id)}-bg.webp" alt="">`;
  if (k === 'frame') return ring(id, face(mainOf(), m.user.portrait));
  return `<b aria-hidden="true">${esc([...titleName(id)][0] || '')}</b>`;
}
function seasonHtml() {
  const s = m.season, track = s && GD.prog.track[s.id];
  if (!track) return '';   // the season has not started
  const prev = s.step ? track[s.step - 1][1] : 0;
  const pct = s.next ? Math.round(100 * Math.max(0, s.stars - prev) / Math.max(1, s.next - prev)) : 100;
  const steps = track.map(([n, stars, rew]) => {
    const got = n <= s.step, label = [tg('ch_step', { n }), rew ? rewardName(rew) : '', tg('season_stars', { n: stars })].filter(Boolean).join(' · ');
    return `<li class="s-step${got ? ' got' : ''}${rew ? ' rw' : ''}${n === s.step + 1 ? ' next' : ''}"${n === s.step + 1 ? ' aria-current="step"' : ''}>
      <span class="s-dot" role="img" aria-label="${esc(label)}" title="${esc(label)}"><span class="s-pt${rew ? ' rw' : ''}">${rew ? rewardThumb(rew) : ''}</span></span><i>${n}</i></li>`;
  }).join('');
  return `<section aria-labelledby="seH"><div class="sec-h"><h2 id="seH">${esc(tg('season'))}</h2></div><div class="frame box s-sec">
    <div class="s-head"><b>${esc(tg('season_stars', { n: s.stars }))}</b><span>${esc(tg('season_step', { n: s.step }))}</span>
      <span class="g-bar g-sm" role="img" aria-label="${esc(tg('season_stars', { n: s.stars }))}"><i class="g-fill" style="width:${pct}%"></i></span></div>
    <ol class="s-track" tabindex="0" aria-label="${esc(tg('season'))}">${steps}</ol><p class="small">${esc(tg('season_keep'))}</p></div></section>`;
}

function secChronicle() {
  const c = chron;

    : c.loading || !c.loaded ? '<div class="skel" style="min-height:120px"></div>' : `<p class="small">${esc(tg('chronicle_empty'))}</p>`;

    <div class="frame box">${list}${c.more ? `<div class="row"><button type="button" class="btn ghost" data-act="chronMore"${c.loading ? ' disabled' : ''}>${esc(tg('chronicle_more'))}</button></div>` : ''}</div>`;
}
/** Own chronicle: the owner reads it through /u/:id/chronicle even when it is hidden from others (R13). 20 lines a page. */
function loadChron(more) {
  const c = chron;
  if (c.loading) return;
  c.loading = true;
  const before = more && c.items.length ? '?before=' + c.items[c.items.length - 1].at : '';
  M.api(`/u/${m.user.id}/chronicle${before}`).then(r => {
    const items = r.items || [];
    c.items = more ? c.items.concat(items) : items;
    c.more = items.length >= 20;   // a full page: there may be more (the API page is 20 lines)
  }, () => { c.more = false; }).finally(() => { c.loading = false; c.loaded = true; if (m && sec === 'chronicle') cabinet(); });
}

const REP_FIELD = { name: 'report_name', motto: 'report_motto', other: 'report_other' };

    return `<div class="g-rep"><h3><a href="${playerUrl(g.target)}">${esc(g.name || g.target)}</a> · ${esc(tg(REP_FIELD[g.field] || 'report_other'))} · ${esc(tg('reports_n', { n: g.n }))}</h3>

function loadReps() {

function resolveRep(b, action) {

  M.api('/admin/reports/resolve', { body: { target: b.dataset.t, field: b.dataset.f, action } }).then(() => { reps = null; cabinet(); }, e => { b.disabled = false; const n = $('#repNote'); if (n) { n.textContent = errText(e); n.className = 'msg err'; } });

function secAccount() {

    <div class="frame box"><label class="chk"><input type="checkbox" id="aSound"${on ? ' checked' : ''}>Звук при новом достижении</label></div>
    <div class="frame box"><h3>Ссылка для друга</h3><p class="small">Друг входит по ней — вам засчитывается «Вербовщик». Сейчас по вашей ссылке: ${m.user.refs || 0}.</p>
      <div class="row"><input id="aRef" readonly value="${esc(refUrl())}" aria-label="Ссылка для друга" style="flex:1 1 280px"><button type="button" class="btn ghost" data-act="copyRef">${ico('copy')}Скопировать</button></div><span class="msg" id="aRefNote" role="status"></span></div>
    <div class="frame box"><h3>Мои данные</h3><p class="small">Всё, что мы храним о вас, одним файлом JSON.</p><div class="row"><a class="btn ghost" href="${esc(M.API)}/me/export" download>Скачать мои данные</a></div></div>

      <div class="row"><button type="button" class="btn ghost" data-act="logout">Выйти</button><button type="button" class="btn danger" data-act="delete">Удалить профиль и все данные</button></div></div>`;

function cabinet() {
  parkForm();
  const c = mainOf(), p = asPlayer(c);
  const ach = m.achievements.length, all = GD.ach.length;
  if (!secs().some(x => x[0] === sec)) sec = 'chars';
  const nav = secs().map(([id, t]) => `<a href="#${id}"${sec === id ? ' aria-current="page"' : ''}>${esc(t)}${id === 'chars' ? `<span>${esc(fill('%n из 3', { n: m.characters.length }))}</span>` : id === 'ach' ? `<span>${ach} / ${all}</span>` : ''}</a>`).join('');
  const body = { chars: secChars, look: secLook, ach: secAch, frames: secFrames, chronicle: secChronicle, account: secAccount, reports: secReports }[sec]();
  $('#view').innerHTML = `<p class="lab">Карточка — как вас видят другие</p>${bcard(p, { h: 'h2', reveal })}${gloryHtml()}${levelAsk()}${nextHtml()}${weekHtml()}${seasonHtml()}${pathHtml()}
    <div class="lay"><nav class="frame pnav" aria-label="Кабинет">${nav}<hr><a class="pub" href="${playerUrl(m.user.id)}">Моя страница ↗</a></nav><section class="sec" id="sec">${body}</section></div>`;
  reveal = false;
  const cur = $('.s-track');   // the season track opens at the step in progress
  const at = cur && ($('.s-step.next', cur) || $$('.s-step.got', cur).pop());
  if (at) cur.scrollLeft = Math.max(0, at.offsetLeft - cur.clientWidth / 2);
  if (sec === 'chronicle' && !chron.loaded) loadChron(false);
  if (sec === 'reports' && reps === null) loadReps();
  const mn = $('#lMotto');
  if (mn) { const cnt = () => { $('#lMottoN').textContent = fill('%n из 60', { n: [...mn.value].length }); }; mn.addEventListener('input', cnt); cnt(); }
}

function render() {
  if (!m) return screen('login');
  if (!m.characters.length) return wizard();
  cabinet();
}

function put(body, noteId) {
  return M.api('/me', { method: 'PUT', body }).then(r => M.took(r), e => { const n = $('#' + noteId); if (n) { n.textContent = errText(e); n.className = 'msg err'; } });
}

/* clicks of the cabinet: one listener, the view is redrawn on every change of /me */
document.addEventListener('click', e => {
  if (!m || !e.target.closest('#view')) return;
  const t = e.target;
  const editCard = t.closest('[data-edit]');
  if (editCard) return openEd(m.characters.find(c => c.id === +editCard.dataset.edit));
  const nav = t.closest('.pnav a[href^="#"]');
  if (nav) { e.preventDefault(); sec = nav.getAttribute('href').slice(1); history.replaceState(null, '', '#' + sec); cabinet(); $('#sec').scrollIntoView({ block: 'nearest' }); return; }
  const fr = t.closest('[data-frame]');
  if (fr) return put({ frame: fr.dataset.frame }, sec === 'look' ? 'lookNote' : 'frNote');
  const bg = t.closest('[data-bg]');
  if (bg) return put({ background: bg.dataset.bg }, 'lookNote');
  const ct = t.closest('[data-cat]');
  if (ct) { cat = ct.dataset.cat; return cabinet(); }
  const pt = t.closest('#lPortrait button');
  if (pt) return put({ portrait: pt.dataset.v }, 'lookNote');
  const nc = t.closest('[data-ncolor]');
  if (nc) return put({ name_color: nc.dataset.ncolor }, 'lookNote');
  const sh = t.closest('[data-sh]');
  if (sh) {
    const i = +sh.dataset.i, list = showcaseList();
    return sh.dataset.sh === 'del' ? saveShowcase(list.filter((x, k) => k !== i)) : moveShowcase(i, i + (sh.dataset.sh === 'up' ? -1 : 1));
  }
  const lg = t.closest('#lfgSeg button');
  if (lg) return M.api('/me/lfg', { method: 'PUT', body: { kind: lg.dataset.v || null } }).then(r => M.took(r), () => {});
  const a = t.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'add') openEd(null);
  else if (act === 'edit') openEd(mainOf());
  else if (act === 'radio') { const r = $('.radiobtn'); if (r) r.click(); }
  else if (act === 'account') { sec = 'account'; history.replaceState(null, '', '#account'); cabinet(); }
  else if (act === 'card') copyText(myUrl()).then(ok => { if (ok) M.track('show_card'); a.textContent = ok ? 'Скопировано' : myUrl(); });
  else if (act === 'copyRef') copyText(refUrl()).then(ok => { $('#aRefNote').textContent = ok ? 'Скопировано' : 'Не удалось скопировать, выделите ссылку и скопируйте вручную'; });
  else if (act === 'lfgOn') {   // the task button leads to the «Looking for group» switch; the kind is the player's choice
    sec = 'chars'; history.replaceState(null, '', '#chars'); cabinet();
    const b = $('#lfgSeg button:not([data-v=""])');
    if (b) { b.scrollIntoView({ block: 'center' }); b.focus(); }
  } else if (act === 'swap') {
    a.disabled = true;
    M.api('/me/weekly/swap', { body: { task_id: a.dataset.task } }).then(r => M.took(r), e => {
      a.disabled = false;
      const n = $('#wkNote'); if (n) { n.textContent = errText(e); n.className = 'msg err'; }
      if (e.code === 'swap_used' || e.code === 'task_done') M.me(true);   // the page was out of date: show what the server has
    });
  } else if (act === 'showAdd') {
    const id = $('#shPick') && $('#shPick').value, list = showcaseList();
    if (id) saveShowcase(list.concat(id));
  } else if (act === 'chronMore') loadChron(true);
  else if (act === 'repKeep' || act === 'repHide' || act === 'repBan') resolveRep(a, { repKeep: 'keep', repHide: 'hide', repBan: 'ban' }[act]);
  else if (act === 'lfgMore') M.api('/me/lfg', { method: 'PUT', body: { kind: a.dataset.v } }).then(r => M.took(r), () => {});
  else if (act === 'motto') put({ motto: $('#lMotto').value }, 'lookNote').then(() => { const n = $('#lookNote'); if (n && !n.classList.contains('err')) n.textContent = 'Девиз сохранён'; });
  else if (act === 'lvl') {
    const c = mainOf();
    a.disabled = true;
    M.api('/characters/' + c.id, { method: 'PUT', body: Object.assign({}, c, { level: +a.dataset.lvl }) }).then(r => M.took(r), () => { a.disabled = false; });
  } else if (act === 'logout') M.api('/auth/logout', { body: {} }).then(() => M.forget(), () => M.forget());
  else if (act === 'delete') openDelete();
});
document.addEventListener('change', e => {
  if (!m) return;
  if (e.target.id === 'lTitle') put({ title: e.target.value || null }, 'lookNote');
  else if (e.target.id === 'lNick') put({ show_nick: e.target.checked }, 'lookNote');
  else if (e.target.id === 'cHide') put({ hide_chronicle: e.target.checked }, 'chNote');
  else if (e.target.id === 'aSound') M.sound(e.target.checked);
});
document.addEventListener('keydown', e => {
  const card = e.target.closest && e.target.closest('[data-edit]');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); }
});

document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('.g-cell[data-i]');
  if (!c) return;
  dragFrom = +c.dataset.i;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', String(dragFrom)); } catch (x) { /* old browsers */ }
  c.classList.add('drag');
});
document.addEventListener('dragover', e => {
  const c = e.target.closest && e.target.closest('.g-cell');
  if (dragFrom < 0 || !c) return;
  e.preventDefault();
  $$('.g-cell.over').forEach(x => { if (x !== c) x.classList.remove('over'); });
  c.classList.add('over');
});
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('.g-cell');
  if (dragFrom < 0 || !c) return;
  e.preventDefault();
  const to = $$('.g-show .g-cell').indexOf(c), from = dragFrom;
  dragFrom = -1;
  moveShowcase(from, to);
});
document.addEventListener('dragend', () => { dragFrom = -1; $$('.g-cell.drag, .g-cell.over').forEach(x => x.classList.remove('drag', 'over')); });
document.addEventListener('error', e => { if (e.target.matches && e.target.matches('.s-pt img')) e.target.remove(); }, true);   // art of a reward that is not painted yet

function openDelete() {
  const d = $('#delDlg');
  $('#delW').textContent = DEL_WORD; $('#delWord').value = ''; $('#delGo').disabled = true; $('#delNote').textContent = '';
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  $('#delWord').focus();
}
$('#delWord').addEventListener('input', e => { $('#delGo').disabled = e.target.value.trim().toLocaleUpperCase(HL) !== DEL_WORD.toLocaleUpperCase(HL); });
$('#delNo').onclick = () => $('#delDlg').close();
$('#delGo').onclick = () => {
  $('#delGo').disabled = true;
  M.api('/me', { method: 'DELETE' }).then(() => { $('#delDlg').close(); M.forget(); }, e => { $('#delNote').textContent = errText(e); $('#delGo').disabled = false; });
};

function start() {
  $('#view').innerHTML = '<div class="skel" style="min-height:250px"></div>';
  M.api('/me').then(r => M.took({ me: r }), e => { if (e.status !== 401) screen('down'); });
}

ready(Mx => {
  M = Mx;
  const ref = new URLSearchParams(location.search).get('ref');
  if (ref && /^\d{1,20}$/.test(ref)) try { localStorage.setItem('gabella-ref', ref); } catch (e) { /* private mode */ }
  const h = location.hash.slice(1);
  if (SECS0.some(s => s[0] === h) || h === 'reports') sec = h;   // «reports» is checked against m.admin when the cabinet is drawn
  if (!M) return screen('down');
  wireForm();
  if (['not-member', 'discord-down', 'members-only'].includes(h)) return screen(h);
  let got = false;
  M.onMe(state => {
    got = true;
    const was = lastRank, idx = id => GD.ranks.findIndex(r => r.id === id);
    m = state;
    if (m) { reveal = was !== null && idx(m.user.rank) > idx(was); lastRank = m.user.rank; }
    if (!m) { closeEd(); chron = newChron(); reps = null; }
    render();
  });
  // me.js keeps quiet when the API is unreachable: ask once more to tell «logged out» (401) from «server down»
  M.me().then(() => {
    if (!got) M.api('/me').then(r => M.took({ me: r }), e => { if (e.status !== 401) screen('down'); });
  });
});
</script>

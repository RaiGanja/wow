# Синие посты Blizzard про Forever -> задача с меткой blue (tools/blue_watch.py): каждые 15 минут и вручную.
# По задаче пишется запись NEWS (шаблон в задаче); цель — запись на сайте не позже 3 часов после поста.
name: blue
on:
  schedule: [{ cron: '4,19,34,49 * * * *' }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: { group: blue, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/blue_watch.py --issues
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
